# Po11y CLA check — asks first-time contributors to sign CLA.md. Advisory: it
# is deliberately not a required check, so a maintainer can merge unsigned.
#
# `pull_request_target` (not `pull_request`) is required because the action
# writes the signature ledger back to this repository, and a fork's
# `pull_request` run only gets a read-only token. That is safe ONLY because
# this workflow never checks out the fork's code. Do not add an
# `actions/checkout` of `github.event.pull_request.head.sha` here — that turns
# `pull_request_target` into arbitrary code execution with a writable token.
#
# The ledger is written through the contents API, which cannot create a branch
# and cannot push to a protected one. If `main` ever gets branch protection,
# create an unprotected `cla-signatures` branch by hand and point `branch:` at
# it; the action will not create it for you.
#
# `signatures/version1/cla.json` must stay in the repository. The action creates
# it on the first pull request it ever sees, and that first run then FAILS with
# "Committers ... have to sign the CLA" even for an allowlisted author — the
# file is created and read in the same pass. Re-running the job passes. Deleting
# the file arms the same one-off failure for the next contributor, who will read
# it as a rejection of their pull request. See signatures/README.md.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Spelled out so the ledger write still works where the repository default for
# workflow permissions is read-only.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signatures
    runs-on: ubuntu-24.04
    steps:
      - name: CLA assistant
        # Two triggers land here, so filter: pull request events, plus comments
        # that are the sign-off phrase or a `recheck`. The phrase must stay
        # byte-identical to the action's default, which is why
        # `custom-pr-sign-comment` is deliberately unset.
        if: >-
          (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # Pinned to a SHA, not a tag: a tag can be moved. (v2.6.1)
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/LabRise-Consulting/po11y/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: main
          # `*[bot]` matches GitHub App accounts, which always end in `[bot]`.
          # A bot cannot post a signing comment, so without this its pull
          # requests sit red forever.
          allowlist: scholtalbers,*[bot]
          # Stops a contributor deleting the comment that recorded their
          # signature. Set false to keep merged pull requests open for
          # discussion — the JSON ledger is the durable record either way.
          lock-pullrequest-aftermerge: true
