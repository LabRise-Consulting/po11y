services:
  n8n:
    build:
      context: .
      args:
        N8N_IMAGE: ${N8N_IMAGE:-docker.io/n8nio/n8n:2.29.8}
    container_name: po11y-n8n
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TZ:-Europe/Berlin}
      - TZ=${TZ:-Europe/Berlin}
      - N8N_DIAGNOSTICS_ENABLED=false
      # Plain HTTP — acceptable on localhost / a private network only.
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://${BIND_ADDR:-127.0.0.1}:5678/
      # Code nodes write /po11y-status/*.json via the fs builtin (the only
      # builtin allowed). $env is blocked in nodes so a workflow cannot read
      # the DB / Grafana passwords out of the process environment; the ai-map
      # workflow reads its optional AI config from /run/po11y/ai-map.json
      # (rendered by bootstrap from .env, mounted read-only, not web-served).
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      # n8n >=2.0 disables Execute Command by default; the workflow map
      # (n8n export:workflow) still needs it. The host Docker socket is no
      # longer mounted here, so this shell is confined to the n8n container.
      - NODES_EXCLUDE=[]
      # --- datastore ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:?run ./bootstrap.sh (or set in .env)}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-4380}
      # --- metrics (scraped by prometheus) ---
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      # Feed the bundled Webhook/Form execution dashboards (from the official
      # n8n-io/n8n-observability set). WORKFLOW_INFO adds the n8n_workflow_info
      # gauge both dashboards join against.
      - N8N_METRICS_INCLUDE_WEBHOOK_METRICS=true
      - N8N_METRICS_INCLUDE_FORM_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_INFO=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./packs:/packs:ro
      # Optional AI-map config, not on the web-served status volume. bootstrap
      # renders it from .env; empty file = heuristic map (no LLM).
      - ./secrets/ai-map.json:/run/po11y/ai-map.json:ro
      - po11y_status:/po11y-status
    depends_on:
      - postgres
      - docker-proxy

  # Read-only Docker API proxy. n8n reads the containers list for the dashboard
  # through this instead of mounting the host socket directly: only the
  # container-list endpoint is exposed (CONTAINERS=1), every mutating and
  # sensitive endpoint is denied, and the real socket is never reachable from
  # n8n. A compromised n8n therefore cannot control the host's Docker daemon.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: po11y-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1   # GET /containers/json only
      - POST=0         # deny all writes (default, set explicit)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16-alpine
    container_name: po11y-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE:-n8n}
      - POSTGRES_USER=${DB_POSTGRESDB_USER:-n8n}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD:?run ./bootstrap.sh (or set in .env)}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: po11y-prometheus
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-180d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - n8n

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: po11y-grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?run ./bootstrap.sh (or set in .env)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:?run ./bootstrap.sh (or set in .env)}
      # Grafana interpolates ${VAR} in provisioning YAML but NOT in dashboard
      # JSON — the entrypoint seds the n8n deep-link host into a rendered copy.
      - BIND_ADDR=${BIND_ADDR:-127.0.0.1}
      - GF_PATHS_PROVISIONING=/tmp/grafana-provisioning
      - GF_SERVER_ROOT_URL=http://${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8080}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=${DASHBOARD_GRAFANA_EMBED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=${DASHBOARD_GRAFANA_EMBED:-true}
    entrypoint:
      - sh
      - -euc
      - |
        rm -rf /tmp/grafana-provisioning
        cp -r /etc/grafana/provisioning-src /tmp/grafana-provisioning
        sed -i "s|__WEB_BIND_ADDR__|$$BIND_ADDR|g" /tmp/grafana-provisioning/dashboards/json/*.json
        sed -i "s|/etc/grafana/provisioning/|/tmp/grafana-provisioning/|g" /tmp/grafana-provisioning/dashboards/dashboards.yml
        exec /run.sh
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning-src:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
      - prometheus

  dashboard:
    image: nginx:1.27-alpine
    container_name: po11y-dashboard
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"
    environment:
      # Read-scoped n8n API key for the /n8n-table/ proxy (optional — see
      # README "n8n DataTable read proxy"). Empty is fine when no list tab
      # is configured; nginx still starts, the proxy just forwards no key.
      - N8N_READ_API_KEY=${N8N_READ_API_KEY:-}
      # Optional "user:password" gate for the whole dashboard (see .env.example).
      - DASHBOARD_BASIC_AUTH=${DASHBOARD_BASIC_AUTH:-}
    entrypoint:
      - sh
      - -euc
      - |
        # Explicit variable list: only the key is substituted; every other
        # dollar-variable in the template stays an nginx runtime variable.
        # The key is whitelisted to the n8n API-key (JWT) charset first, so
        # no value can break out of the quoted header directive into nginx
        # syntax.
        N8N_READ_API_KEY="$$(printf %s "$$N8N_READ_API_KEY" | tr -cd 'A-Za-z0-9._~+/=-')" \
          envsubst '$${N8N_READ_API_KEY}' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/default.conf
        if [ -n "$$DASHBOARD_BASIC_AUTH" ]; then
          user="$${DASHBOARD_BASIC_AUTH%%:*}"
          pass="$${DASHBOARD_BASIC_AUTH#*:}"
          printf '%s:%s\n' "$$user" "$$(cryptpw -m sha512 "$$pass")" > /etc/nginx/.htpasswd
          printf 'auth_basic "po11y";\nauth_basic_user_file /etc/nginx/.htpasswd;\n' > /etc/nginx/auth.conf
        else
          : > /etc/nginx/auth.conf
        fi
        exec nginx -g 'daemon off;'
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./site:/usr/share/nginx/site:ro
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./config.json:/run/po11y/config.json:ro
      - po11y_status:/po11y-status:ro
    depends_on:
      - grafana

volumes:
  n8n_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  po11y_status:
