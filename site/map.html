<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow map</title>
<style>
  /* Token subset of html/style.css — keep in sync by hand (tiny). */
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #71717a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #e4e4e7; --muted: #a1a1aa; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 system-ui, sans-serif; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  #map { overflow-x: auto; }
  #map svg { max-width: none; }
</style>
</head>
<body>
<p class="meta" id="meta">loading map…</p>
<div id="map"></div>
<script src="/vendor/mermaid.min.js"></script>
<script>
(async () => {
  const meta = document.getElementById('meta');
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
  try {
    const r = await fetch('/map.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('map.json missing — is the workflow-map workflow active?');
    const d = await r.json();
    const { svg } = await mermaid.render('wfmap', d.mermaid);
    document.getElementById('map').innerHTML = svg;
    meta.textContent = `${d.workflows} workflows · generated ${new Date(d.generated_at).toLocaleString()}`;
  } catch (e) {
    meta.textContent = e.message;
  }
})();
</script>
</body>
</html>
