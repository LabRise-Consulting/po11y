# Po11y example nginx config — copy into your stack and adjust the aliases.
# Serves the static app, the instance config, the live status feeds, and any
# instance pages (iframe tabs) under /site/.
#
# Upstreams (if you enable the grafana/prometheus blocks) should be variables:
# a literal proxy_pass hostname is resolved at config load, so nginx refuses
# to start whenever a backend container is down. Variables defer resolution to
# request time via a resolver (127.0.0.11 = Docker's embedded DNS).
server {
  listen 80;
  server_name _;

  # Optional access control: the dashboard entrypoint writes auth.conf from
  # DASHBOARD_BASIC_AUTH (user:password in .env) — either an auth_basic pair
  # or an empty file. Applies to everything this server serves.
  include /etc/nginx/auth.conf;

  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Instance config — render it from env at container start, or mount it.
  location = /config.json {
    alias /run/po11y/config.json;
    add_header Cache-Control "no-store";
  }

  # Live state + notification feed, written by your publisher (atomically:
  # write to a tmp file on the same volume, then rename).
  location = /status.json {
    alias /po11y-status/status.json;
    add_header Cache-Control "no-store";
  }
  location = /notifications.json {
    alias /po11y-status/notifications.json;
    add_header Cache-Control "no-store";
  }

  # Workflow map, written by the maps core workflow.
  location = /map.json {
    alias /po11y-status/map.json;
    add_header Cache-Control "no-store";
  }

  # AI-authored architecture map, written by the maps core workflow.
  location = /ai-map.json {
    alias /po11y-status/ai-map.json;
    add_header Cache-Control "no-store";
  }

  # Live form-trigger inventory, written by the maps core workflow; the
  # dashboard merges it into the Actions cards.
  location = /forms.json {
    alias /po11y-status/forms.json;
    add_header Cache-Control "no-store";
  }

  # Instance pages: every entry in config "tabs" is an iframe onto /site/...
  location /site/ {
    alias /usr/share/nginx/site/;
  }

  # Form-trigger submit proxy — POST only, same origin, so the dashboard can
  # fire field-less forms via fetch() without CORS and without :5678 being
  # reachable from the client. GET (the rendered form page) is intentionally
  # NOT proxied: forms with fields still open n8n's own page, which knows how
  # to serve its assets.
  location /form/ {
    limit_except POST { deny all; }
    set $n8n_upstream http://n8n:5678;
    proxy_pass $n8n_upstream;
  }

  # Grafana in subpath mode (GF_SERVER_SERVE_FROM_SUB_PATH=true). The variable
  # upstream + resolver mean nginx starts fine even while grafana is down —
  # safe to keep active in vendored setups without a grafana service too.
  location /grafana/ {
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_set_header Host $http_host;
    # With DASHBOARD_BASIC_AUTH on, the browser sends its Basic credentials on
    # every request; Grafana would try them against its own users and 401.
    # Grafana logins use session cookies, so dropping the header is safe.
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Prometheus: exactly the two read-only query endpoints, GET only — the
  # browser gets keyless metric reads and nothing else.
  location = /prom/api/v1/query {
    limit_except GET { deny all; }
    set $prometheus_upstream http://prometheus:9090;
    rewrite ^/prom(/.*)$ $1 break;
    proxy_pass $prometheus_upstream;
  }
  location = /prom/api/v1/query_range {
    limit_except GET { deny all; }
    set $prometheus_upstream http://prometheus:9090;
    rewrite ^/prom(/.*)$ $1 break;
    proxy_pass $prometheus_upstream;
  }

  # n8n DataTable read proxy — GET only, key injected server-side so the
  # browser never sees it. The ${N8N_READ_API_KEY} reference below is filled
  # at container start by `envsubst '$${N8N_READ_API_KEY}'` (see the dashboard
  # service entrypoint in docker-compose.yml) — the explicit variable list
  # means every other $var in this file stays an nginx runtime variable, and
  # any character in the key is passed through verbatim (no sed metacharacter
  # hazards).
  # A list tab's endpoint points at
  # /n8n-table/data-tables/<id>/rows?... — nginx rewrites to n8n's public API.
  # On n8n Community Edition API keys CANNOT be scoped — any key is full-access
  # to the public API. This prefix match (data-tables only) plus the explicit
  # deny below is therefore the ONLY control keeping the injected key
  # read-only-to-data-tables; it is not defence-in-depth, it is the whole
  # defence. Do not widen this location or remove the deny.
  location /n8n-table/data-tables {
    limit_except GET { deny all; }
    set $n8n_upstream http://n8n:5678;
    rewrite ^/n8n-table/(.*)$ /api/v1/$1 break;
    proxy_pass $n8n_upstream;
    proxy_set_header X-N8N-API-KEY "${N8N_READ_API_KEY}";
    proxy_set_header Accept "application/json";
  }

  # Everything else under /n8n-table/ is refused outright. On n8n Community
  # Edition API keys cannot be scoped, so the injected key is FULL-ACCESS to
  # n8n's public API: this deny — with the data-tables prefix match above —
  # is the only thing keeping this proxy read-only-to-data-tables. CI asserts
  # /n8n-table/workflows returns 403; do not remove or reorder these blocks.
  location /n8n-table/ {
    return 403;
  }
}
