# Grafana — dashboards over the n8n postgres + prometheus. Compose:
# grafana/grafana-oss:11.3.1. Runs the SHARED entrypoint script
# (observability/grafana/entrypoint.sh, mounted from the grafana-entrypoint
# ConfigMap — see README step 3): it copies the read-only provisioning source
# to a writable /tmp copy, seds the n8n deep-link host into the dashboard
# JSON, rewrites the dashboards.yml provider path, and copies the alerting
# rules in when /etc/grafana/alerting-src is present. Do not inline a copy of
# that script here: ci/check-grafana-entrypoint.sh guards against it, because a
# copy that silently lacks the alerting branch is the known failure. Grafana
# serves from /grafana/ behind nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: po11y
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO grafana-data
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # grafana image runs as uid/gid 472; make the PVC writable by it.
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Grafana's n8n-postgres datasource used to authenticate as n8n's own
      # database user, while GF_AUTH_ANONYMOUS_ENABLED below hands every
      # unauthenticated visitor the Viewer role — and a Viewer may run arbitrary
      # SQL against a datasource through /api/ds/query. Anyone who could reach
      # Grafana could therefore read credentials_entity and execution_data.
      # The compose stack does not have this problem because bootstrap.sh
      # creates a SELECT-only role first; these manifests had no equivalent, and
      # the divergence was noted in 02-configmaps.yaml rather than fixed.
      #
      # This is that equivalent. It runs the same SQL bootstrap.sh does, on
      # every rollout, so a role that drifts (or a database restored without it)
      # is repaired rather than left to fail closed at query time. It is the
      # only place in this Deployment that holds DB_POSTGRESDB_PASSWORD.
      #
      # Deny-by-default, exactly as on compose: no ALTER DEFAULT PRIVILEGES, so
      # tables added by a future n8n migration stay unreadable until this runs
      # again — which a rollout does.
      initContainers:
        - name: create-readonly-role
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGHOST
              value: "postgres"
            - name: PGUSER
              value: "n8n"
            - name: PGDATABASE
              value: "n8n"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: po11y-secrets
                  key: DB_POSTGRESDB_PASSWORD
            - name: PO11Y_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: po11y-secrets
                  key: PO11Y_RO_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              # postgres has its own readiness probe, but a Deployment rollout
              # can still land while it is restarting. Wait rather than crash-loop.
              i=0
              until pg_isready -q; do
                i=$((i+1))
                [ "$i" -lt 60 ] || { echo "postgres did not become ready"; exit 1; }
                sleep 2
              done
              # -v pw so the password is a bound literal, never string-pasted
              # into the statement.
              psql -v ON_ERROR_STOP=1 -v pw="$PO11Y_RO_PASSWORD" <<'SQL'
              DO $$ BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'po11y_ro') THEN
                  CREATE ROLE po11y_ro LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
                END IF;
              END $$;
              -- Reasserted on every run, not only at CREATE: a pre-existing po11y_ro keeps
              -- whatever attributes it was created with, and the table-level REVOKE below
              -- removes none of them. NOINHERIT also stops any leftover role membership
              -- from conferring its privileges.
              ALTER ROLE po11y_ro LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT PASSWORD :'pw';
              -- Strip role memberships the same way. Each REVOKE may fail when this user
              -- lacks ADMIN OPTION on the granted role — warn rather than abort, since
              -- NOINHERIT above already neutralises what the membership would confer.
              DO $$
              DECLARE g name;
              BEGIN
                FOR g IN
                  SELECT p.rolname FROM pg_auth_members m
                  JOIN pg_roles p ON p.oid = m.roleid
                  JOIN pg_roles c ON c.oid = m.member
                  WHERE c.rolname = 'po11y_ro'
                LOOP
                  BEGIN
                    EXECUTE format('REVOKE %I FROM po11y_ro', g);
                    RAISE NOTICE 'po11y_ro: revoked membership in %', g;
                  EXCEPTION WHEN OTHERS THEN
                    RAISE WARNING 'po11y_ro: could not revoke membership in % — %', g, SQLERRM;
                  END;
                END LOOP;
              END $$;
              GRANT USAGE ON SCHEMA public TO po11y_ro;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO po11y_ro;
              REVOKE ALL ON TABLE credentials_entity, execution_data FROM po11y_ro;
              SQL
              echo "po11y_ro role granted (read-only, credentials/execution payloads denied)"
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.3.1
          # The one true entrypoint, same file compose mounts (see the header
          # comment). It writes the rendered provisioning tree to /tmp, which
          # is an emptyDir so the rootfs can stay read-only.
          command: ["sh", "/etc/po11y-grafana-entrypoint.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: po11y-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            # The datasource authenticates as po11y_ro, never as n8n's own DB
            # user — same posture as the compose stack, where bootstrap.sh
            # creates the role. This container therefore never holds
            # DB_POSTGRESDB_PASSWORD; only the init container above does, and
            # only long enough to create the role.
            - name: PO11Y_RO_USER
              value: "po11y_ro"
            - name: PO11Y_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: po11y-secrets
                  key: PO11Y_RO_PASSWORD
            # The address this stack publishes on.
            - name: BIND_ADDR
              value: "127.0.0.1"
            # Host a reader's browser reaches n8n at — baked into the dashboard
            # JSON by the entrypoint sed. Empty falls back to BIND_ADDR; set it
            # when n8n is not on the address the dashboards are served from.
            - name: N8N_LINK_HOST
              value: ""
            - name: GF_PATHS_PROVISIONING
              value: "/tmp/grafana-provisioning"
            # http://${BIND_ADDR}:${DASHBOARD_PORT}/grafana/ with defaults.
            - name: GF_SERVER_ROOT_URL
              value: "http://127.0.0.1:8080/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            # DASHBOARD_GRAFANA_EMBED default (true): anonymous Viewer + iframes.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            # Optional alert delivery. Empty/unset => the entrypoint drops the
            # contact-points + policies files, so the five alert rules stay
            # visible and firing in the UI but deliver nowhere (same default as
            # compose). Set a webhook URL to enable delivery.
            # - name: GRAFANA_ALERT_WEBHOOK_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: po11y-secrets
            #       key: GRAFANA_ALERT_WEBHOOK_URL
          volumeMounts:
            # The shared entrypoint script (create imperatively, see README).
            - name: entrypoint
              mountPath: /etc/po11y-grafana-entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            # Provisioning source tree, assembled from two ConfigMaps into the
            # layout the entrypoint expects under /etc/grafana/provisioning-src.
            - name: provisioning
              mountPath: /etc/grafana/provisioning-src/datasources/datasources.yml
              subPath: datasources.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning-src/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            # Dashboard JSON dir (create imperatively, see README).
            - name: dashboards-json
              mountPath: /etc/grafana/provisioning-src/dashboards/json
              readOnly: true
            # The alert rules (create imperatively, see README). The volume
            # is optional: without the ConfigMap the directory mounts empty and
            # the entrypoint provisions no rules — the pre-alerting behavior.
            - name: alerting
              mountPath: /etc/grafana/alerting-src
              readOnly: true
            # The entrypoint renders the provisioning copy under /tmp; emptyDir
            # keeps that writable under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: entrypoint
          configMap:
            name: grafana-entrypoint
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards-json
          configMap:
            name: grafana-dashboards-json
        - name: alerting
          configMap:
            name: grafana-alerting
            optional: true
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: po11y
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
