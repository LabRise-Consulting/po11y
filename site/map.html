<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow map</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  // Manual theme override from the shell (localStorage "po11y-theme"): apply
  // before first paint; a toggle in the parent fires the storage event here,
  // and a reload is the simplest way to re-render mermaid in the new theme.
  (() => {
    const t = localStorage.getItem('po11y-theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.dataset.theme = t;
      document.documentElement.style.colorScheme = t;
    }
    addEventListener('storage', (e) => { if (e.key === 'po11y-theme') location.reload(); });
  })();
</script>
<style>
  /* Token subset of html/style.css — keep in sync by hand (tiny). */
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #71717a; }
  :root[data-theme=dark] { --bg: #111113; --fg: #e4e4e7; --muted: #a1a1aa; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { --bg: #111113; --fg: #e4e4e7; --muted: #a1a1aa; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100vh;
         box-sizing: border-box; overflow: hidden; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; flex: none; }
  /* The viewport clips; #map is the single transformed layer inside it. Panning
     moves #map rather than scrolling #viewport, so the transform is the only
     source of truth for where the diagram sits. */
  #viewport { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
              cursor: grab; touch-action: none; }
  #viewport.panning { cursor: grabbing; }
  #map { position: absolute; top: 0; left: 0; transform-origin: 0 0;
         will-change: transform; }
  #map svg { max-width: none; display: block; }
  #map g.node.clickable { cursor: pointer; }
  /* Controls sit above the viewport and must never inherit its pan handlers. */
  .zoom { position: absolute; right: 10px; bottom: 10px; z-index: 10;
          display: flex; gap: 4px; }
  .zoom button { width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
                 border: 1px solid var(--muted); background: var(--bg); color: var(--fg);
                 font: 14px/1 system-ui, sans-serif; padding: 0; }
  .zoom button:hover { border-color: var(--fg); }
  .zoom button:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
             align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .overlay[hidden] { display: none; }
  .dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--muted);
            border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
            max-width: 520px; width: 100%; padding: 18px 22px; position: relative; }
  .dialog h2 { margin: 0 0 8px; font-size: 17px; padding-right: 28px; }
  .dialog p { margin: 0 0 14px; font-size: 13.5px; color: var(--muted); white-space: pre-line; }
  .dialog a { font-size: 13px; }
  .dialog .close { position: absolute; top: 8px; right: 10px; border: 0; background: none;
                   color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; padding: 4px 6px; }
</style>
</head>
<body>
<p class="meta" id="meta">loading map…</p>
<div id="viewport">
  <div id="map"></div>
  <div class="zoom" id="zoom" hidden>
    <button id="z-out" aria-label="zoom out" title="Zoom out (−)">−</button>
    <button id="z-in" aria-label="zoom in" title="Zoom in (+)">+</button>
    <button id="z-fit" aria-label="fit map to view" title="Fit to view (0)">⤢</button>
  </div>
</div>
<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <button class="close" id="dlg-close" aria-label="close">✕</button>
    <h2 id="dlg-title"></h2>
    <p id="dlg-body"></p>
    <a id="dlg-link" target="_blank" rel="noopener" hidden>Open in n8n ↗</a>
  </div>
</div>
<script src="/vendor/mermaid.min.js"></script>
<script type="module">
import { clampScale, zoomAt, fitView, isClick } from './map.lib.js';

// ---- pan/zoom ---------------------------------------------------------------
// One transform on #map is the only state: translate(x, y) scale(k) with
// transform-origin 0 0. All the maths lives in map.lib.js (unit-tested); this
// block is just wiring — measure, listen, apply.
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('map');
let view = { x: 0, y: 0, k: 1 };
let content = { width: 0, height: 0 };
// Once the reader has framed the map themselves, a resize must not yank it back
// to the default fit.
let touched = false;

const boxOf = () => {
  const r = viewport.getBoundingClientRect();
  return { width: r.width, height: r.height };
};
function setView(v) {
  view = { x: v.x, y: v.y, k: clampScale(v.k) };
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
}
function fit() { setView(fitView(content, boxOf())); }
function zoomBy(factor, anchor) {
  const b = boxOf();
  touched = true;
  setView(zoomAt(view, anchor || { x: b.width / 2, y: b.height / 2 }, factor));
}

// Wheel zooms about the pointer. Exponential in deltaY so a trackpad flick and
// a mouse notch both feel proportional rather than linear-then-jumpy.
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY * 0.0015), { x: e.clientX - r.left, y: e.clientY - r.top });
}, { passive: false });

// Drag to pan. Pointer capture keeps the gesture alive when the cursor leaves
// the iframe mid-drag, which is easy to do on a large map.
let panning = null;
let travel = { dx: 0, dy: 0 };
viewport.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  panning = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
  travel = { dx: 0, dy: 0 };
  try { viewport.setPointerCapture(e.pointerId); } catch { /* not capturable */ }
  viewport.classList.add('panning');
});
viewport.addEventListener('pointermove', (e) => {
  if (!panning || e.pointerId !== panning.id) return;
  travel = { dx: e.clientX - panning.sx, dy: e.clientY - panning.sy };
  touched = true;
  setView({ x: panning.ox + travel.dx, y: panning.oy + travel.dy, k: view.k });
});
function endPan(e) {
  if (!panning || e.pointerId !== panning.id) return;
  try { viewport.releasePointerCapture(panning.id); } catch { /* already gone */ }
  panning = null;
  viewport.classList.remove('panning');
}
viewport.addEventListener('pointerup', endPan);
viewport.addEventListener('pointercancel', endPan);

// The controls live inside #viewport, so swallow the press or every button
// click would also begin a pan.
document.getElementById('zoom').addEventListener('pointerdown', (e) => e.stopPropagation());
document.getElementById('z-in').addEventListener('click', () => zoomBy(1.25));
document.getElementById('z-out').addEventListener('click', () => zoomBy(1 / 1.25));
document.getElementById('z-fit').addEventListener('click', () => { touched = false; fit(); });
viewport.addEventListener('dblclick', (e) => {
  const r = viewport.getBoundingClientRect();
  zoomBy(1.5, { x: e.clientX - r.left, y: e.clientY - r.top });
});
addEventListener('keydown', (e) => {
  if (!overlay.hidden) return;                       // dialog owns the keyboard
  if (e.key === '+' || e.key === '=') zoomBy(1.25);
  else if (e.key === '-') zoomBy(1 / 1.25);
  else if (e.key === '0') { touched = false; fit(); }
});
// Refit on resize only while the reader has not framed it themselves.
addEventListener('resize', () => { if (!touched) fit(); });

// Dialog + n8n deep-link base — hand-synced duplicates of site/ai-map.html's
// helpers (site/* accepts tiny duplication over a shared module). Title/body
// go in via textContent, the link via a validated base + encoded id.
const overlay = document.getElementById('overlay');
let lastFocus = null;
function openDialog(title, body, href) {
  document.getElementById('dlg-title').textContent = title;
  document.getElementById('dlg-body').textContent = body;
  const a = document.getElementById('dlg-link');
  if (href) { a.href = href; a.hidden = false; } else { a.hidden = true; }
  lastFocus = document.activeElement;
  overlay.hidden = false;
  document.getElementById('dlg-close').focus();
}
function closeDialog() {
  overlay.hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  lastFocus = null;
}
overlay.addEventListener('click', (e) => {
  if (e.target === overlay || e.target.id === 'dlg-close') closeDialog();
});
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeDialog(); });
async function resolveN8nBase() {
  try {
    const c = await (await fetch('/config.json', { cache: 'no-store' })).json();
    const raw = (typeof c.n8nUrl === 'string' && c.n8nUrl) ? c.n8nUrl : 'http://{host}:5678';
    const host = (typeof c.baseUrl === 'string' && c.baseUrl) ? c.baseUrl : location.hostname;
    const u = raw.replaceAll('{host}', host).replace(/\/$/, '');
    return /^https?:\/\//i.test(u) ? u : null;
  } catch { return 'http://' + location.hostname + ':5678'; }
}

(async () => {
  const meta = document.getElementById('meta');
  const override = document.documentElement.dataset.theme;
  const dark = override ? override === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
  // Scope (config "scopes"): the dashboard passes ?scope=<s> when a non-default
  // scope is active; fetch that namespace's map. No/invalid/default scope keeps
  // today's flat path exactly. Charset guard mirrors nginx's [a-z0-9-] whitelist.
  const scope = new URLSearchParams(location.search).get('scope');
  const scoped = scope && scope !== 'default' && /^[a-z0-9-]+$/.test(scope);
  const mapUrl = scoped ? `/status/${scope}/map.json` : '/map.json';
  const aiMapUrl = scoped ? `/status/${scope}/ai-map.json` : '/ai-map.json';
  try {
    const r = await fetch(mapUrl, { cache: 'no-store' });
    if (!r.ok) throw new Error('map.json missing — is the workflow-map workflow active?');
    const d = await r.json();
    const { svg } = await mermaid.render('wfmap', d.mermaid);
    canvas.innerHTML = svg;
    meta.textContent = `${d.workflows} workflows · generated ${new Date(d.generated_at).toLocaleString()}`;

    // Measure the diagram, then frame it. Mermaid sets an inline max-width that
    // would otherwise cap the SVG at its natural size and fight the transform,
    // so pin the element to its true viewBox dimensions and let scale() do the
    // resizing. viewBox is authoritative; clientWidth is the fallback for an
    // SVG that somehow arrives without one.
    const svgEl = canvas.querySelector('svg');
    if (svgEl) {
      const vb = svgEl.viewBox?.baseVal;
      content = (vb && vb.width)
        ? { width: vb.width, height: vb.height }
        : { width: svgEl.clientWidth, height: svgEl.clientHeight };
      svgEl.style.maxWidth = 'none';
      svgEl.setAttribute('width', content.width);
      svgEl.setAttribute('height', content.height);
      document.getElementById('zoom').hidden = false;
      fit();
    }

    // Clickable workflow nodes: map.json.entries links each mermaid node id
    // (nid) back to the raw n8n id + description. The po11y server writes it
    // (server/n8n.test.mjs asserts the shape); a map from some other
    // publisher without entries renders exactly as before, nothing clickable.
    const entries = new Map((d.entries || []).map((e) => [e.nid, e]));
    if (!entries.size) return;
    const n8nBase = await resolveN8nBase();
    // Optional richer text: ai-map.json wf: nodes may carry an AI summary.
    let summaries = new Map();
    try {
      const ar = await fetch(aiMapUrl, { cache: 'no-store' });
      if (ar.ok) {
        const a = await ar.json();
        summaries = new Map((a.nodes || [])
          .filter((n) => typeof n.id === 'string' && n.id.startsWith('wf:') && n.summary)
          .map((n) => [n.id.slice(3), n.summary]));
      }
    } catch { /* feed optional */ }
    // Mermaid (pinned 11.4.1) emits id="flowchart-<nid>-<n>"; nid never
    // contains "-" (sanitizer maps to _), so this split is unambiguous.
    // Trigger nodes (t0, t1, …) have no entry and stay inert.
    document.querySelectorAll('#map g.node').forEach((g) => {
      const m = /^flowchart-(.+?)-\d+$/.exec(g.id || '');
      const e = m && entries.get(m[1]);
      if (!e) return;
      g.classList.add('clickable');
      g.addEventListener('click', () => {
        // A pan that happened to start on this node still ends with a click
        // event here — only open the dialog if the pointer barely moved.
        if (!isClick(travel.dx, travel.dy)) return;
        openDialog(e.name, summaries.get(String(e.id)) || e.sub || '',
          n8nBase ? `${n8nBase}/workflow/${encodeURIComponent(String(e.id))}` : null);
      });
    });
  } catch (e) {
    meta.textContent = e.message;
  }
})();
</script>
</body>
</html>
