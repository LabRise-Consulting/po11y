# PersistentVolumeClaims — the k8s equivalent of the named volumes in
# docker-compose.yml (n8n_data, postgres_data, prometheus_data, grafana_data).
#
# All are ReadWriteOnce (RWO), each mounted by its single owning pod, so RWO
# is exactly right; the owning Deployments use strategy: Recreate so a
# rollout never tries to attach the same RWO volume to two pods at once.
#
# There is no po11y_store PVC here: there is no server Deployment on k8s (see
# deploy/k8s/README.md's "Status feeds do not work" section), so nothing on
# this path needs the store's persistence yet.
# Adjust storageClassName / sizes to your cluster; blank storageClassName uses
# the cluster default.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: po11y
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: po11y
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: po11y
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: po11y
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
