# Prometheus alerting rules for po11y. Loaded only when the alerting
# overlay is in play — see docker-compose.alerts.yml.
#
# These are NOT the watchdog's defaults restated. They are the thresholds that
# make sense for a rule that runs continuously against a counter, and they
# differ from the watchdog's on purpose:
#
#   rule      here                          watchdog default
#   failing   >= 3 errors in 1h             >= 3 errors AND >= 50% of the window
#   stale     no success in 6h              off (ALERT_STALE_AFTER_MIN=0)
#   stuck     running > 1h                  off (ALERT_STUCK_AFTER_MIN=0)
#
# The watchdog's `failing` also carries an error-*rate* floor that no PromQL
# rule here reproduces: a busy workflow with three failures among a thousand
# runs alerts here and does not there. Tune to taste; do not assume parity.
#
# Running both is supported but means double notification: pick one path, or
# set ALERTS_ENABLED=false (the watchdog is on by default) and let Alertmanager
# own routing.
groups:
  - name: po11y
    interval: 60s
    rules:
      # Nothing else in this file can fire if the server itself is gone --
      # every other rule reads a series the server produces. This is the one
      # rule that does not depend on po11y being alive.
      - alert: Po11yServerDown
        expr: up{job="po11y-server"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "po11y server is not being scraped"
          description: "Prometheus cannot scrape server:8081. The dashboard feeds are almost certainly stale too."

      # The server is alive and telling us it cannot reach n8n: down, hung,
      # or the API key stopped working.
      - alert: Po11yN8nUnreachable
        expr: po11y_n8n_up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "n8n is unreachable from the po11y server"
          description: "The server has failed to reach the n8n API for over 10 minutes."

      # Belt-and-braces for a poll loop that wedged, or that keeps running
      # without ever reaching n8n: the gauge says up, but no poll has
      # completed. The series is stamped by the executions poll-fill tick,
      # and only on a fetch that actually answered (server/sync.mjs pollFill)
      # — so 1800s is 60 missed ticks at the default POLL_INTERVAL of 30s.
      # Deliberately generous: a single slow tick must not page anyone.
      - alert: Po11yPollStalled
        expr: time() - po11y_poll_last_success_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "po11y has not completed a poll in over 30 minutes"
          description: "Last successful poll was {{ $value | humanizeDuration }} ago."

      # Cosmetic, so warning and a long window: the Architecture tab keeps its
      # structure and falls back to heuristic descriptions, and nothing else in
      # the stack depends on the LLM. It is worth knowing about because the
      # usual cause is silent — a keyless free-tier provider exhausting its
      # quota looks identical to a working map until you read the footer.
      #
      # The series is absent when no LLM is configured (OMNIROUTE_ENABLED=false
      # and no AI_MAP_*), so this rule cannot fire on a stack that never wanted
      # one. It is also absent until a rebuild has actually called the LLM —
      # buildAiMap republishes without calling it when the workflow set has not
      # changed, and the metric deliberately holds its last reading rather than
      # inventing an all-clear.
      - alert: Po11yAiMapLlmDegraded
        expr: po11y_ai_map_llm_up == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "po11y's architecture map has lost its LLM"
          description: "The last ai-map build fell back to heuristic descriptions. Check the gateway or provider quota; the map itself is still correct."

      - alert: Po11yWorkflowFailing
        expr: increase(po11y_workflow_errors_total[1h]) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Workflow {{ $labels.workflow_name }} is failing"
          description: "{{ $value | printf \"%.0f\" }} errored executions in the last hour."

      # Staleness is measured from last SUCCESS, never last run: a workflow
      # erroring every five minutes has a perfectly fresh last-run timestamp,
      # so a run-based rule stays silent on exactly the workflow that needs
      # attention. Workflows that have never succeeded export no series here
      # and are covered by Po11yWorkflowFailing instead -- see the comment in
      # metrics.mjs on why zero-filling would be worse.
      - alert: Po11yWorkflowStale
        expr: time() - po11y_workflow_last_success_timestamp_seconds > 21600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Workflow {{ $labels.workflow_name }} has not succeeded in 6 hours"
          description: "Last success was {{ $value | humanizeDuration }} ago."

      - alert: Po11yWorkflowStuck
        expr: po11y_workflow_running_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Workflow {{ $labels.workflow_name }} has an execution stuck for over an hour"
          description: "Oldest running execution started {{ $value | humanizeDuration }} ago."
