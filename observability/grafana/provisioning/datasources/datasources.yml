apiVersion: 1

datasources:
  - name: n8n-postgres
    uid: n8n-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${DB_POSTGRESDB_DATABASE}
    # Dedicated read-only role (created by bootstrap.sh): SELECT on everything
    # except credentials_entity and execution_data, no sequence/signal grants.
    # Grafana never holds n8n's own database credentials.
    user: ${PO11Y_RO_USER}
    secureJsonData:
      password: ${PO11Y_RO_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
    isDefault: false

  - name: n8n-prometheus
    uid: n8n-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
