# Feeds served by the po11y server — the only feed path. The upstream is a
# runtime variable: DNS is resolved per request via the resolver declared in
# nginx.conf, so the dashboard starts even when the server container is down.
location ~ ^/(?<feed>status|map|forms|ai-map|notifications)\.json$ {
  set $feed_upstream __FEED_UPSTREAM__;
  proxy_pass $feed_upstream$request_uri;
  proxy_set_header Host $host;
  # Same direct-to-nginx header-forgery scrub as /grafana/ and /mcp/ in
  # nginx.conf (see that note): our auth never reads client request headers,
  # but a forged Authorization or identity header must not reach the server.
  proxy_set_header Authorization "";
  proxy_set_header X-Auth-Request-User "";
  proxy_set_header X-Auth-Request-Email "";
  proxy_set_header X-Auth-Request-Groups "";
  proxy_set_header X-Forwarded-User "";
  proxy_set_header X-Forwarded-Email "";
  proxy_set_header X-Forwarded-Groups "";
  add_header Cache-Control "no-store" always;
}

location ~ ^/status/(?<scope>[a-z0-9-]+)/(?<feed>(status|notifications|map|ai-map|forms)\.json)$ {
  set $feed_upstream __FEED_UPSTREAM__;
  proxy_pass $feed_upstream$request_uri;
  proxy_set_header Host $host;
  proxy_set_header Authorization "";
  proxy_set_header X-Auth-Request-User "";
  proxy_set_header X-Auth-Request-Email "";
  proxy_set_header X-Auth-Request-Groups "";
  proxy_set_header X-Forwarded-User "";
  proxy_set_header X-Forwarded-Email "";
  proxy_set_header X-Forwarded-Groups "";
  add_header Cache-Control "no-store" always;
}
