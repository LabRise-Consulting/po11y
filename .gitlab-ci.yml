# Po11y CI — the first pipeline for the stack. Jobs:
#   test           node's built-in test runner over the html/, site/, lib/
#                  and server/ unit tests
#   lint           shellcheck over every shell script
#   compose-config daemonless `docker compose config` of both compose files,
#                  plus each merged with the forward-auth overlay
#   manifests      kustomize build + kubeconform schema validation of deploy/k8s
#   smoke          full docker-in-docker bring-up via bootstrap.sh + HTTP smoke,
#                  run twice to also prove bootstrap idempotency
#   publish-images on git tags only: multi-arch build + push of the server
#                  image to this project's container registry
#
# All image tags are pinned. test/lint/manifests are skipped on scheduled
# pipelines (the nightly schedule only cares about the smoke build against a
# fresh upstream n8n image); smoke runs on every pipeline.
#
# Runner policy: every validate-stage job is untagged and daemonless, so it
# runs anywhere — GitLab shared runners, a fork's own runners, or the
# self-hosted one. Only `smoke` needs a privileged dind host, so it alone
# carries a tag and is restricted to the canonical project; forks and
# contributors still get the six validate jobs on stock infrastructure.

stages:
  - validate
  - smoke
  - publish

workflow:
  rules:
    # Merge request pipelines.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Scheduled pipelines (the nightly latest-n8n-image build).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Tag pipelines (release: validate + smoke gate the image publish).
    - if: '$CI_COMMIT_TAG'
    # A branch push that already has an open MR would otherwise create a
    # duplicate branch pipeline alongside the MR pipeline — suppress it.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Pushes to the default branch (main).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Skip on schedules; run on every other pipeline the workflow rules allow.
.not-on-schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

test:
  stage: validate
  image: node:24-alpine
  extends: .not-on-schedule
  script:
    # Directory-scoped node test runner. Node expands the ** glob itself (it is
    # quoted so the shell leaves it alone).
    - node --test "html/**/*.test.mjs" "site/**/*.test.mjs" "lib/**/*.test.mjs" "server/**/*.test.mjs"

lint:
  stage: validate
  image: koalaman/shellcheck-alpine:v0.10.0
  extends: .not-on-schedule
  script:
    - shellcheck bootstrap.sh ci/smoke.sh ci/check-expired-markers.sh ci/check-grafana-entrypoint.sh observability/grafana/entrypoint.sh scripts/backup-store.sh ci/check-dashboard-entrypoint.sh deploy/nginx/dashboard-entrypoint.sh
    # Fail if any dated '# REMOVE AFTER YYYY-MM' liability in bootstrap.sh is past.
    - sh ci/check-expired-markers.sh bootstrap.sh
    # Guard the A3 bug class: an overlay re-inlining grafana's entrypoint
    # silently drops the alert rules (compose replaces, never merges).
    - sh ci/check-grafana-entrypoint.sh
    - sh ci/check-dashboard-entrypoint.sh

interlock:
  # Proves the exposure interlock stays wired: bootstrap.sh with a non-loopback
  # BIND_ADDR and no auth must exit 78 (EX_CONFIG) — and it must do so BEFORE any
  # docker call, so this job needs no docker daemon. Asserts exit 78, nothing else.
  stage: validate
  image: alpine:3.20
  extends: .not-on-schedule
  before_script:
    # Packages the bootstrap lines that run before the interlock need: python3
    # and openssl (its two prerequisite checks, plus secret generation), and
    # docker-cli only so the `command -v docker` check passes (no daemon is
    # contacted).
    - apk add --no-cache python3 openssl docker-cli
  script:
    - printf 'BIND_ADDR=192.0.2.1\n' > .env
    - |
      set +e
      ./bootstrap.sh --no-examples
      code=$?
      set -e
      if [ "$code" -ne 78 ]; then
        echo "interlock FAILED: expected exit 78, got $code"
        exit 1
      fi
      echo "interlock OK: refused non-loopback bind with exit 78"

compose-config:
  # Client-side render + schema validation of BOTH compose files. `docker compose
  # config` never contacts a daemon — it only parses and interpolates — so this
  # needs no dind service and no privileged runner, unlike smoke. Dummy values
  # satisfy the required (:?) vars; the rendered output is discarded with -q.
  # --project-name isolates the check from any real project state. This is the
  # only syntax gate on docker-compose.yml (previously ungated) and the
  # read-only docker-compose.readonly.yml.
  stage: validate
  image: docker:27
  extends: .not-on-schedule
  variables:
    # Bundled-stack required (:?) vars.
    DB_POSTGRESDB_PASSWORD: dummy
    PO11Y_RO_PASSWORD: dummy
    GRAFANA_ADMIN_PASSWORD: dummy
    # Read-only-stack required (:?) vars.
    N8N_API_URL: http://example:5678
    N8N_API_KEY: dummy
    N8N_METRICS_TARGET: example:5678
    # Forward-auth overlay required (:?) vars.
    OAUTH2_PROXY_OIDC_ISSUER_URL: http://idp.example:8080/realms/dummy
    OAUTH2_PROXY_CLIENT_ID: dummy
    OAUTH2_PROXY_CLIENT_SECRET: dummy
    # 32-byte secret (base64url) — oauth2-proxy requires exactly 16/24/32 bytes.
    OAUTH2_PROXY_COOKIE_SECRET: cG8xMXktY2ktZHVtbXktY29va2llLXNlY3JldC0zMmI
    # Alerting overlay required (:?) var.
    ALERTMANAGER_WEBHOOK_URL: http://example:5678/webhook/dummy
  before_script:
    # docker:27 ships the docker CLI but not the compose plugin.
    - apk add --no-cache docker-cli-compose
  script:
    - docker compose -f docker-compose.yml --project-name po11y-ci-check config -q
    - docker compose -f docker-compose.readonly.yml --project-name po11y-ci-check config -q
    # Both base compose files must also merge cleanly with the forward-auth overlay.
    - docker compose -f docker-compose.yml -f docker-compose.auth.yml --project-name po11y-ci-check config -q
    - docker compose -f docker-compose.readonly.yml -f docker-compose.auth.yml --project-name po11y-ci-check config -q
    # The alerting overlay must merge cleanly onto the read-only stack, alone
    # and stacked with forward-auth.
    - docker compose -f docker-compose.readonly.yml -f docker-compose.alerts.yml --project-name po11y-ci-check config -q
    - docker compose -f docker-compose.readonly.yml -f docker-compose.alerts.yml -f docker-compose.auth.yml --project-name po11y-ci-check config -q
    - apk add --no-cache jq
    # The otel overlay must merge cleanly onto the bundled stack, and must NOT
    # take the grafana provisioning render with it. Compose replaces an
    # entrypoint rather than merging it, and an inline copy in the overlay is
    # how all five Grafana alert rules once vanished from the exact command
    # docs/deployment.md gives.
    # Both halves of that failure are asserted: the shared entrypoint survives
    # the merge, and alerting-src is still mounted for it to find.
    - docker compose -f docker-compose.yml -f docker-compose.otel.yml --project-name po11y-ci-check config -q
    - |
      merged=$(docker compose -f docker-compose.yml -f docker-compose.otel.yml --project-name po11y-ci-check config --format json)
      base_ep=$(docker compose -f docker-compose.yml --project-name po11y-ci-check config --format json | jq -r '.services.grafana.entrypoint | join(" ")')
      otel_ep=$(printf '%s' "$merged" | jq -r '.services.grafana.entrypoint | join(" ")')
      if [ "$base_ep" != "$otel_ep" ]; then
        echo "grafana entrypoint differs under the otel overlay ('$otel_ep' vs '$base_ep') — do not re-declare it, mount into /etc/po11y-grafana-extras instead"
        exit 1
      fi
      printf '%s' "$merged" | jq -e '.services.grafana.volumes | map(.target) | index("/etc/grafana/alerting-src")' > /dev/null \
        || { echo "otel overlay lost the alerting mount"; exit 1; }
    # Prometheus's command is likewise replaced, not merged: the otel overlay
    # restates the base flags to add the remote-write receiver Tempo needs.
    - |
      base_cmd=$(docker compose -f docker-compose.yml --project-name po11y-ci-check config --format json | jq -r '.services.prometheus.command | join("\n")')
      otel_cmd=$(docker compose -f docker-compose.yml -f docker-compose.otel.yml --project-name po11y-ci-check config --format json | jq -r '.services.prometheus.command | join("\n")')
      expected=$(printf '%s\n--web.enable-remote-write-receiver' "$base_cmd")
      if [ "$otel_cmd" != "$expected" ]; then
        printf 'otel prometheus command drifted from the base compose\n--- expected ---\n%s\n--- got ---\n%s\n' "$expected" "$otel_cmd"
        exit 1
      fi

manifests:
  stage: validate
  image: alpine/k8s:1.31.1
  extends: .not-on-schedule
  variables:
    KUBECONFORM_VERSION: "0.6.7"
  script:
    # alpine/k8s ships kustomize + curl; add a pinned kubeconform release.
    - curl -sSLf "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
    - kustomize build deploy/k8s | kubeconform -strict -summary

smoke:
  stage: smoke
  image: docker:27
  # dind needs a privileged runner, and untagged jobs can land on runners
  # that don't provide one. `dind` = any privileged runner in the group that
  # advertises it, rather than one specific host — a single-host tag means the
  # whole smoke stage stops the moment that host is asleep.
  tags:
    - dind
  rules:
    # Privileged runners are provided by the labrise group. Elsewhere (a fork,
    # a contributor's namespace) the job would hang forever waiting for a tag
    # nobody provides, so skip it rather than stall the pipeline — the six
    # validate jobs above still run and are the gate that matters for review.
    - if: '$CI_PROJECT_PATH != "labrise/po11y"'
      when: never
    - when: on_success
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Per-build network so the dind service is reachable by its `docker`
    # alias — legacy links networking does not add it on all runners.
    FF_NETWORK_PER_BUILD: "true"
    # The compose stack runs on the dind daemon, reachable from this job as
    # `docker` — tell bootstrap to poll n8n/readiness there, not localhost.
    PO11Y_CONNECT_HOST: docker
    # This job seeds BIND_ADDR=0.0.0.0 with no basic auth, which trips the
    # bootstrap exposure interlock. Safe here: the stack lives on a throwaway
    # per-build dind network, not a routable host. Allow the open bind.
    PO11Y_ALLOW_OPEN_BIND: "1"
    # Opts into the in-network compose-exec assertions in ci/smoke.sh (server
    # /healthz and /metrics), which otherwise stay off because they don't
    # work against a remote/non-compose BASE_URL.
    SMOKE_COMPOSE_FILES: '-f docker-compose.yml'
  timeout: 30m
  before_script:
    # curl+jq for smoke.sh; python3+openssl+compose plugin are what bootstrap.sh
    # itself needs (python3 hard-required, openssl for the generated secrets,
    # docker-cli-compose for `docker compose`) — the base docker image has none.
    - apk add --no-cache curl jq python3 openssl docker-cli-compose
  script:
    # Minimal .env: bootstrap generates the secrets and appends them. 0.0.0.0
    # so the published ports are reachable from this job at the dind alias.
    # AI_MAP_BASE_URL is set explicitly so bootstrap skips its OmniRoute
    # auto-wire (which defaults the api key and model): the key stays empty,
    # the server reads an empty key as "LLM off", and the smoke ai-map
    # assertion tests the deterministic heuristic map instead of a live
    # auto/best-free call whose latency has blown the 90 s budget.
    # OmniRoute itself still boots — the overlay bring-up stays covered.
    - printf 'BIND_ADDR=0.0.0.0\nAI_MAP_BASE_URL=http://omniroute:20128/v1\n' > .env
    # Examples ARE imported here, unlike every other job. They used to be
    # redundant: workflows/core/ held the two publisher workflows and bootstrap
    # imported them unconditionally, so n8n always had something in it. Both are
    # deleted, workflows/core/ is gone, and --no-examples now leaves n8n
    # completely empty — which makes the feeds correct but blank, and the
    # ai-map/forms assertions test nothing. hn-tech-news imports inactive, so it
    # costs one import and makes no outbound call.
    #
    # Bring up, smoke, then bring up again (idempotency) and re-smoke. On any
    # failure capture compose logs for the artifact before failing the job.
    - |
      if ! (
        ./bootstrap.sh &&
        BASE_URL=http://docker:8080 ci/smoke.sh &&
        ./bootstrap.sh &&
        BASE_URL=http://docker:8080 ci/smoke.sh
      ); then
        docker compose -f docker-compose.yml -f docker-compose.omniroute.yml logs --tail 200 > compose-logs.txt 2>&1 || true
        exit 1
      fi
  artifacts:
    when: on_failure
    paths:
      - compose-logs.txt

publish-images:
  # Prebuilt images so `docker compose up` (or any k8s manifest) can pull
  # instead of building from a clone. Only po11y's OWN code is published —
  # server/ (the MCP surface ships inside the server image) — never the root
  # Dockerfile: that one derives from n8n's image (Sustainable Use License),
  # and the bundled stack needs the clone for bootstrap.sh regardless. The Dockerfile is
  # a dependency-free COPY of the repo source, so a "build" here is a file
  # copy: multi-arch via qemu is cheap (one RUN, a mkdir+chown).
  #
  # Publishes:
  #   registry.gitlab.com/labrise/po11y/server:<git tag>   (immutable)
  #   registry.gitlab.com/labrise/po11y/server:latest      (moving alias)
  stage: publish
  image: docker:27
  # Same runner policy as smoke: buildx + qemu need a privileged dind host.
  tags:
    - dind
  rules:
    # Registry pushes are a canonical-project concern; a fork tagging its own
    # clone would hang waiting for a `dind` runner it doesn't have.
    - if: '$CI_PROJECT_PATH != "labrise/po11y"'
      when: never
    # Tags only — this stage runs after validate + smoke pass on the tagged
    # commit, so a published image is by definition a green build.
    - if: '$CI_COMMIT_TAG'
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
  timeout: 20m
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # qemu user-mode emulation so the arm64 layer of the manifest builds on the
    # amd64 runner (Apple Silicon and Raspberry Pi hosts pull arm64).
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install arm64
    - docker buildx create --use
  script:
    # --provenance=false keeps the pushed artifact a plain two-entry manifest
    # list; the default attestation manifests render as an extra unknown/unknown
    # "architecture" in the GitLab registry UI.
    - |
      for name in server; do
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --file "$name/Dockerfile" \
          --tag "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_TAG" \
          --tag "$CI_REGISTRY_IMAGE/$name:latest" \
          --provenance=false \
          --push .
      done
