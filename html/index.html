<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Po11y</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand">
      <img src="favicon.svg" alt="" width="24" height="24">
      <span id="title"></span>
    </div>
    <p class="lede" id="lede"></p>
    <nav class="nav" id="nav" aria-label="views"></nav>
    <footer id="footer"></footer>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="body">
    <header class="topbar">
      <button class="menu" id="menu" aria-label="open navigation">☰</button>
      <h1 id="view-title">Overview</h1>
      <span class="spacer"></span>
      <span id="offline" class="badge" hidden>unreachable</span>
      <span id="stale" class="badge warn" hidden>stale</span>
      <span id="updated" class="updated"></span>
      <button class="theme" id="theme" aria-label="switch color theme"></button>
    </header>
    <main id="main">
      <section id="view-overview" class="view"></section>
    </main>
  </div>
</div>
<!-- type=module so app.js can import the unit-tested helpers in app.lib.js;
     module scripts are deferred, which this tag already relied on by sitting
     at the end of the body. -->
<script type="module" src="app.js"></script>
</body>
</html>
