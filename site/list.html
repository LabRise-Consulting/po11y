<!-- site/list.html — generic list/cards tab. Config-driven; see config.example.json tabs[]. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>List</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; padding: 12px; }
    .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .bar + .bar { margin-top: -6px; }
    .bar button { padding: 4px 10px; cursor: pointer; }
    .bar button.active { font-weight: 700; }
    /* Range buttons are generated, so the group needs its own flex gap. */
    #ranges { display: flex; gap: 8px; }
    h2.day { margin: 18px 0 8px; font-size: 14px; opacity: .7; }
    .card { display: block; padding: 10px 12px; margin: 6px 0; border: 1px solid #8883;
            border-radius: 8px; text-decoration: none; color: inherit; }
    .card h3 { margin: 0 0 4px; font-size: 15px; }
    .card .meta { font-size: 13px; opacity: .75; }
    .card .jtitle { color: inherit; text-decoration: none; }
    .card .jtitle:hover { text-decoration: underline; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
             letter-spacing: .04em; padding: 1px 7px; margin-right: 6px; border-radius: 999px;
             border: 1px solid #8886; opacity: .85; vertical-align: middle; }
    .score { float: right; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid #8886; }
    .empty { opacity: .6; }
    .more { margin: 14px 0; padding: 6px 14px; cursor: pointer; }
    /* Expandable fit/gap analysis (cards whose feed carries a `detail` column). */
    details.detail { margin-top: 8px; }
    details.detail > summary { cursor: pointer; font-size: 13px; opacity: .8; list-style: revert; }
    table.fitgap { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
    table.fitgap td { padding: 3px 7px; border-top: 1px solid #8882; vertical-align: top; }
    table.fitgap td:first-child { white-space: nowrap; width: 1%; }
    table.fitgap td:nth-child(2) { font-weight: 600; }
    .tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
    .tag.fit { color: #1a7f37; }
    .tag.gap { color: #b35900; }
    .fitgap tr.gap.real .tag { color: #c0392b; }
    .fitgap tr.gap.debatable td { opacity: .7; }
  </style>
</head>
<body>
  <div class="bar">
    <span>Range:</span>
    <span id="ranges"></span>
  </div>
  <div class="bar">
    <span>Sort:</span>
    <button id="sort-day">Newest</button>
    <button id="sort-score">Best fit</button>
    <span id="count" style="margin-left:auto;opacity:.6"></span>
  </div>
  <div id="list"><p class="empty">loading…</p></div>
  <button class="more" id="more" hidden>load more</button>

  <script type="module">
    import { sortItems, groupByDay, filterByRange, walkPages, RANGES } from '/lib/list-rows.mjs';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
      (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const safeUrl = (u) => /^(https?:\/\/|\/)/i.test(String(u ?? '')) ? esc(u) : '#';

    const $ = (id) => document.getElementById(id);
    let settings = { endpoint: '', mapping: {}, defaultSort: 'day', defaultRange: 'all',
                     pageSize: 250, title: 'List' };
    let sortBy = 'day';
    let range = 'all';
    // How many pages the walk below may pull. A bounded range usually stops
    // itself well before this (see windowComplete); `load more` raises it when
    // the budget, not the data, was the binding constraint.
    let maxPages = 1;

    // n8n's DataTable API rejects limit > 250, so widening the page is not an
    // option — covering a window means walking pages by cursor.
    const basePages = (r) => (r === 'all' ? 1 : 8);

    // Which tab am I? Match the config tabs[] entry whose src ends with list.html.
    async function loadSettings() {
      try {
        const cfg = await (await fetch('/config.json', { cache: 'no-store' })).json();
        const me = (cfg.tabs || []).find((t) => String(t.src || '').includes('list.html'));
        if (me && me.list) settings = { ...settings, ...me.list };
      } catch { /* defaults */ }
      sortBy = settings.defaultSort || 'day';
      range = settings.defaultRange || 'all';
      maxPages = basePages(range);
      document.title = settings.title || 'List';
    }

    // Walk pages until the feed runs out, the selected window is provably
    // covered, or the page budget is spent. Returns the rows plus whether the
    // budget was what stopped it — the only case where `load more` can help.
    // A static JSON feed carries no nextCursor, so it settles after one pass.
    // forceIdSort is deliberately omitted: the browser keeps honouring the
    // tab's configured sortBy, exactly as before this walk moved into lib/.
    async function loadRows() {
      const fetchJson = async (u) => (await fetch(u, { cache: 'no-store' })).json();
      return walkPages(fetchJson, {
        endpoint: settings.endpoint,
        mapping: settings.mapping,
        pageSize: settings.pageSize || 250,
        maxPages,
        range,
        today: todayIso(),
        base: location.origin,
      });
    }

    function todayIso() {
      // Browser-local date-only; group labels are cosmetic so local tz is fine.
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // Fit/gap analysis table. A gap's assessment is read for a leading
    // "real"/"debatable" keyword to style real gaps distinctly from soft ones.
    function detailTable(rows) {
      const body = rows.map((r) => {
        const real = r.kind === 'gap' && /^\s*real\b/i.test(r.assessment);
        const soft = r.kind === 'gap' && /^\s*debatable\b/i.test(r.assessment);
        const rowCls = r.kind === 'gap' ? `gap${real ? ' real' : soft ? ' debatable' : ''}` : 'fit';
        const label = r.kind === 'gap' ? (real ? 'real gap' : 'gap') : 'fit';
        return `<tr class="${rowCls}"><td><span class="tag ${r.kind}">${esc(label)}</span></td>`
          + `<td>${esc(r.aspect)}</td><td>${esc(r.assessment)}</td></tr>`;
      }).join('');
      return `<table class="fitgap"><tbody>${body}</tbody></table>`;
    }

    function cardHtml(it) {
      const parts = Object.entries(it.meta).filter(([, v]) => v !== null && v !== '')
        .map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(' · ');
      const score = it.score === null ? '' : `<span class="score">${esc(it.score)}</span>`;
      // Provenance pill. Rendered before the title rather than folded into the
      // meta line so it survives a long meta run-on and stays scannable when
      // the list mixes several upstreams.
      const badge = it.badge ? `<span class="badge" data-badge="${esc(it.badge)}">${esc(it.badge)}</span>` : '';
      // With a detail feed the card expands: the title links out, the body
      // toggles a fit/gap table. A whole-card <a> can't wrap a <details>, so
      // detail cards are a <div>. No detail ⇒ unchanged whole-card link.
      if (it.detail && it.detail.length) {
        const title = it.url
          ? `<a class="jtitle" href="${safeUrl(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
          : esc(it.title);
        const fits = it.detail.filter((r) => r.kind === 'fit').length;
        const gaps = it.detail.length - fits;
        const sum = `${fits} fit${fits !== 1 ? 's' : ''}, ${gaps} gap${gaps !== 1 ? 's' : ''}`;
        return `<div class="card expandable">${score}<h3>${badge}${title}</h3><div class="meta">${parts}</div>`
          + `<details class="detail"><summary>fit / gap analysis · ${sum}</summary>${detailTable(it.detail)}</details></div>`;
      }
      const inner = `${score}<h3>${badge}${esc(it.title)}</h3><div class="meta">${parts}</div>`;
      return it.url
        ? `<a class="card" href="${safeUrl(it.url)}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="card">${inner}</div>`;
    }

    // Sorting is a client-side reshuffle of rows already in hand, so it must not
    // re-walk the feed. Only a new window or a raised budget invalidates.
    let cache = { key: null, walk: null };
    async function walkRows() {
      const key = `${range}|${maxPages}`;
      if (cache.key !== key) cache = { key, walk: await loadRows() };
      return cache.walk;
    }

    async function render() {
      let walk;
      try { walk = await walkRows(); }
      catch { $('list').innerHTML = '<p class="empty">feed unavailable</p>'; return; }
      const items = sortItems(filterByRange(walk.rows, range, todayIso()), sortBy);
      $('count').textContent = `${items.length} shown`;
      // Only offered when the page budget — not the data — ended the walk.
      // Once a window is provably covered there is nothing left to load.
      $('more').hidden = !walk.truncated;
      if (!items.length) { $('list').innerHTML = '<p class="empty">nothing yet</p>'; return; }
      if (sortBy === 'score') {
        $('list').innerHTML = items.map(cardHtml).join('');
      } else {
        $('list').innerHTML = groupByDay(items, todayIso())
          .map((g) => `<h2 class="day">${esc(g.label)}</h2>` + g.items.map(cardHtml).join(''))
          .join('');
      }
    }

    function paintSort() {
      $('sort-day').classList.toggle('active', sortBy === 'day');
      $('sort-score').classList.toggle('active', sortBy === 'score');
    }

    function paintRange() {
      for (const b of $('ranges').querySelectorAll('button')) {
        b.classList.toggle('active', b.dataset.range === range);
      }
    }

    function setSort(by) { sortBy = by; paintSort(); render(); }

    function setRange(key) {
      range = key;
      maxPages = basePages(key);   // new window ⇒ fresh walk, any `load more` resets
      paintRange();
      render();
    }

    // Range buttons come from RANGES so the key set lives only in the lib.
    $('ranges').innerHTML = RANGES
      .map((r) => `<button data-range="${esc(r.key)}">${esc(r.label)}</button>`).join('');
    $('ranges').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-range]');
      if (b) setRange(b.dataset.range);
    });
    $('sort-day').addEventListener('click', () => setSort('day'));
    $('sort-score').addEventListener('click', () => setSort('score'));
    $('more').addEventListener('click', () => { maxPages += 1; render(); });

    await loadSettings();
    paintSort();
    paintRange();
    render();
  </script>
</body>
</html>
