# Minimal single-binary Grafana Tempo config for local trace storage.
# Receives OTLP from n8n (HTTP :4318 / gRPC :4317), stores traces on a local
# volume, and serves them to Grafana on :3200. Not tuned for scale — this is
# the low-friction "see your n8n execution traces" path, matching Po11y's
# single-box default.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h   # keep traces 2 days; bump for longer history

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Derive metrics from the trace stream (per-span latency/call/error counts and
# a service graph) and remote-write them into the existing Prometheus, so a
# Grafana dashboard can chart node-level latency/errors without storing traces
# as time series. Prometheus must run with --web.enable-remote-write-receiver
# (the OTel override adds it).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      processor:
        span_metrics:
          # Promote n8n's span attributes to metric labels so the dashboard can
          # break latency/errors down per workflow, per node, and per node type.
          # (dots become underscores: n8n_workflow_name, n8n_node_name, ...)
          dimensions:
            - n8n.workflow.name
            - n8n.node.name
            - n8n.node.type
            - n8n.execution.status

usage_report:
  reporting_enabled: false
