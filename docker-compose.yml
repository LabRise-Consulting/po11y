services:
  n8n:
    build:
      context: .
      args:
        N8N_IMAGE: ${N8N_IMAGE:-docker.io/n8nio/n8n:2.29.8}
    container_name: po11y-n8n
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TZ:-Europe/Berlin}
      - TZ=${TZ:-Europe/Berlin}
      - N8N_DIAGNOSTICS_ENABLED=false
      # Plain HTTP — acceptable on localhost / a private network only.
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://${BIND_ADDR:-127.0.0.1}:5678/
      # No Code-node builtins are enabled. NODE_FUNCTION_ALLOW_BUILTIN=fs used
      # to be set for the publisher workflows that wrote the dashboard's feeds
      # to a shared volume; the server owns every feed now and no shipped
      # workflow requires a builtin. $env is blocked in nodes so a workflow
      # cannot read the DB / Grafana passwords out of the process environment.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      # NODES_EXCLUDE is deliberately NOT set: n8n >=2.0 disables Execute
      # Command by default, and po11y no longer needs it. It was re-enabled
      # instance-wide (NODES_EXCLUDE=[]) for one deleted workflow's `n8n
      # export:workflow` step — the server reads workflows over the API.
      # --- datastore ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:?run ./bootstrap.sh (or set in .env)}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-4380}
      # n8n also prunes by row count (default 10000), which can undercut
      # MAX_AGE on busy instances; raise it so the age window is what rules.
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-100000}
      # --- metrics (scraped by prometheus) ---
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      # Feed the bundled Webhook/Form execution dashboards (from the official
      # n8n-io/n8n-observability set). WORKFLOW_INFO adds the n8n_workflow_info
      # gauge both dashboards join against.
      - N8N_METRICS_INCLUDE_WEBHOOK_METRICS=true
      - N8N_METRICS_INCLUDE_FORM_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_INFO=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./packs:/packs:ro
    depends_on:
      - postgres

  # NOTE: there is no docker-proxy sidecar and no host Docker socket anywhere
  # in this stack. The socket was mounted (read-only, through a proxy scoped to
  # GET /containers/json) for one workflow that filled the dashboard's
  # container card. That card is gone permanently — see docs/server.md's
  # accepted regressions — so the mount is gone with it rather than being kept
  # alive as attack surface for a feature that no longer exists.

  postgres:
    image: postgres:16-alpine
    container_name: po11y-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE:-n8n}
      - POSTGRES_USER=${DB_POSTGRESDB_USER:-n8n}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD:?run ./bootstrap.sh (or set in .env)}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: po11y-prometheus
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-180d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - n8n

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: po11y-grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?run ./bootstrap.sh (or set in .env)}
      - GF_USERS_ALLOW_SIGN_UP=false
      # The n8n-postgres datasource authenticates as the read-only po11y_ro
      # role (created by bootstrap.sh) — n8n's own DB credentials are not
      # passed to Grafana at all.
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - PO11Y_RO_USER=po11y_ro
      - PO11Y_RO_PASSWORD=${PO11Y_RO_PASSWORD:?run ./bootstrap.sh (or set in .env)}
      # Grafana interpolates ${VAR} in provisioning YAML but NOT in dashboard
      # JSON — the entrypoint seds the n8n deep-link host into a rendered copy.
      - BIND_ADDR=${BIND_ADDR:-127.0.0.1}
      - GF_PATHS_PROVISIONING=/tmp/grafana-provisioning
      - GF_SERVER_ROOT_URL=http://${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8080}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=${DASHBOARD_GRAFANA_EMBED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=${DASHBOARD_GRAFANA_EMBED:-true}
      # Where Grafana alerts are delivered. Unset is fine and is the default: the
      # rules still evaluate and fire, they just have no contact point (see
      # observability/grafana/entrypoint.sh and alerting/rules.yml).
      # This is a credential — see docs/alerting.md.
      - GRAFANA_ALERT_WEBHOOK_URL=${GRAFANA_ALERT_WEBHOOK_URL:-}
    # Shared by every compose file that runs Grafana. Do NOT inline this again:
    # compose replaces an entrypoint rather than merging it, so a second copy in
    # an overlay silently drops whatever the copy forgot (the otel overlay used
    # to lose all five alert rules that way).
    entrypoint: ["sh", "/etc/po11y-grafana-entrypoint.sh"]
    volumes:
      - ./observability/grafana/entrypoint.sh:/etc/po11y-grafana-entrypoint.sh:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning-src:ro
      # Mounting alerting-src is what turns the alert rules on; the read-only
      # stack does not.
      - ./observability/grafana/alerting:/etc/grafana/alerting-src:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
      - prometheus

  dashboard:
    image: nginx:1.27-alpine
    container_name: po11y-dashboard
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"
    environment:
      # Optional "user:password" gate for the whole dashboard (see .env.example).
      - DASHBOARD_BASIC_AUTH=${DASHBOARD_BASIC_AUTH:-}
      # Form-trigger submit proxy. ON by default here (the Actions tab).
      # See nginx.conf's /form/ note for the gate + security rationale.
      - ENABLE_FORM_PROXY=${ENABLE_FORM_PROXY:-true}
      - FORM_PROXY_UPSTREAM=${FORM_PROXY_UPSTREAM:-http://n8n:5678}
      # Comma-separated OIDC group names allowed to fire forms. ENFORCED ONLY
      # under FORWARD_AUTH (verified $auth_groups); with forward-auth on and this
      # empty, form firing is DENIED by default. Ignored (with a startup notice)
      # when FORWARD_AUTH is off. See nginx.conf's /form/ note + docs/forward-auth.md.
      - FORM_ALLOWED_GROUPS=${FORM_ALLOWED_GROUPS:-}
      # Forward-auth (oauth2-proxy overlay) switch. Off unless the
      # docker-compose.auth.yml overlay flips it on; when on, the entrypoint
      # renders the nginx auth_request include and disables Basic Auth.
      - FORWARD_AUTH=${FORWARD_AUTH:-false}
      # Upstream for the feeds proxied to the po11y server (below). See
      # nginx.conf's feed-routing include and deploy/nginx/feeds-server.conf.
      - FEED_UPSTREAM=${FEED_UPSTREAM:-http://server:8081}
    # Shared by every compose file that runs the dashboard. Do NOT inline this
    # again: compose replaces an entrypoint rather than merging it (the same
    # A3 bug class the grafana entrypoint had) — ci/check-dashboard-entrypoint.sh
    # enforces the canonical form.
    entrypoint: ["sh", "/etc/po11y-dashboard-entrypoint.sh"]
    volumes:
      - ./deploy/nginx/dashboard-entrypoint.sh:/etc/po11y-dashboard-entrypoint.sh:ro
      - ./html:/usr/share/nginx/html:ro
      - ./site:/usr/share/nginx/site:ro
      # Read-only; only the one file exposed by nginx's exact-match location is
      # reachable. See nginx.conf's /lib/list-rows.mjs block.
      - ./lib:/usr/share/nginx/lib:ro
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./config.json:/run/po11y/config.json:ro
      - ./deploy/nginx:/etc/nginx/po11y-feeds:ro
    depends_on:
      - grafana

  # The po11y server — store, feeds, MCP (/mcp) and the /n8n-table read
  # proxy. In the base file (not an overlay): nginx routes /mcp/,
  # /n8n-table/ and every feed to it. The ops key is opt-in (docs/mcp.md):
  # leave MCP_N8N_API_KEY empty and the server runs serving-only (no
  # sync/poll; the ops tools answer unavailable, feed tools answer
  # not-built).
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: po11y-server
    restart: unless-stopped
    read_only: true
    environment:
      N8N_API_URL: ${MCP_N8N_API_URL:-http://n8n:5678}
      # Where a READER opens n8n, as against where this container sends its
      # polls. N8N_API_URL above is the compose-network address, which resolves
      # here and nowhere else, so links built from it were dead for whoever
      # received them. n8n's own WEBHOOK_URL is built from BIND_ADDR for the
      # same reason; this default matches it. Behind a reverse proxy or a
      # tunnel, set N8N_PUBLIC_URL to the external URL.
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-http://${BIND_ADDR:-127.0.0.1}:5678}
      N8N_API_KEY: ${MCP_N8N_API_KEY:-${N8N_API_KEY:-}}
      SYNC_INTERVAL: ${SERVER_SYNC_INTERVAL:-600}
      POLL_INTERVAL: ${SERVER_POLL_INTERVAL:-30}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-30000}
      EXECUTIONS_LIMIT: ${EXECUTIONS_LIMIT:-100}
      PO11Y_RETENTION_DAYS: ${PO11Y_RETENTION_DAYS:-30}
      PO11Y_PACK: ${PO11Y_PACK:-}
      PO11Y_SCOPE: ${PO11Y_SCOPE:-default}
      PO11Y_INGEST_TOKEN: ${PO11Y_INGEST_TOKEN:-}
      PO11Y_DATATABLES: ${PO11Y_DATATABLES:-}
      PO11Y_MAX_BODY_BYTES: ${PO11Y_MAX_BODY_BYTES:-1000000}
      AI_MAP_BASE_URL: ${AI_MAP_BASE_URL:-}
      AI_MAP_API_KEY: ${AI_MAP_API_KEY:-}
      AI_MAP_MODEL: ${AI_MAP_MODEL:-}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ALERT_MIN_ERRORS: ${ALERT_MIN_ERRORS:-}
      ALERT_ERROR_RATE: ${ALERT_ERROR_RATE:-}
      ALERT_STALE_AFTER_MIN: ${ALERT_STALE_AFTER_MIN:-}
      ALERT_STUCK_AFTER_MIN: ${ALERT_STUCK_AFTER_MIN:-}
      ALERT_IGNORE: ${ALERT_IGNORE:-}
      ALERT_RENOTIFY_MIN: ${ALERT_RENOTIFY_MIN:-}
      ALERT_FEED_MAX: ${ALERT_FEED_MAX:-}
      # Push/heartbeat live HERE and nowhere else — two pushers deliver twice.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-slack}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_TIMEOUT_MS: ${ALERT_WEBHOOK_TIMEOUT_MS:-10000}
      ALERT_HEARTBEAT_URL: ${ALERT_HEARTBEAT_URL:-}
      ALERT_HEARTBEAT_TIMEOUT_MS: ${ALERT_HEARTBEAT_TIMEOUT_MS:-10000}
      # MCP sources (docs/mcp.md "Source support" section).
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: ${MCP_GRAFANA_URL-http://grafana:3000}
      GRAFANA_SA_TOKEN: ${MCP_GRAFANA_SA_TOKEN:-}
      GRAFANA_DATASOURCE_UID: ${MCP_GRAFANA_DATASOURCE_UID:-n8n-postgres}
      N8N_READ_API_KEY: ${N8N_READ_API_KEY:-}
      CONFIG_PATH: /app/config.json
    volumes:
      - po11y_store:/data
      - ./config.json:/app/config.json:ro
    depends_on:
      - n8n

volumes:
  n8n_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  po11y_store:
