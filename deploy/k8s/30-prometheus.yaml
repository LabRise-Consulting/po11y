# Prometheus — scrapes n8n:5678/metrics. Compose: prom/prometheus:v2.55.1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: po11y
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO prometheus-data
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # prom/prometheus runs as uid 65534 (nobody); make the mounted PVC writable.
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=180d   # PROMETHEUS_RETENTION
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: po11y-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: po11y
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
