# Dashboard — nginx serving the static app + proxying grafana/prometheus.
# Compose: nginx:1.27-alpine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: po11y
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      # Co-schedule onto the n8n pod's node so both can mount the RWO
      # po11y-status PVC (n8n writes, dashboard reads). Drop this block if you
      # switch po11y-status to ReadWriteMany (see 03-pvcs.yaml).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: n8n
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: config
              mountPath: /run/po11y/config.json
              subPath: config.json
              readOnly: true
            # Static app. po11y-html holds the flat files (index.html, app.js,
            # style.css); po11y-vendor holds html/vendor/ (mermaid.min.js) and
            # is mounted as the vendor subdirectory on top. Create both
            # imperatively — see README (mermaid.min.js is 2.5 MB, not inlined).
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: vendor
              mountPath: /usr/share/nginx/html/vendor
              readOnly: true
            - name: site
              mountPath: /usr/share/nginx/site
              readOnly: true
            # Shared status feeds, read-only (n8n is the writer).
            - name: status
              mountPath: /po11y-status
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: po11y-nginx
        - name: config
          configMap:
            name: po11y-config
        - name: html
          configMap:
            name: po11y-html
        - name: vendor
          configMap:
            name: po11y-vendor
        - name: site
          configMap:
            name: po11y-site
        - name: status
          persistentVolumeClaim:
            claimName: po11y-status
---
# Internal Service. Choose how to expose it below.
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: po11y
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
---
