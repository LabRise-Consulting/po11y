# Po11y example nginx config — copy into your stack and adjust the aliases.
# Serves the static app, the instance config, the live status feeds, and any
# instance pages (iframe tabs) under /site/.
#
# Upstreams (if you enable the grafana/prometheus blocks) should be variables:
# a literal proxy_pass hostname is resolved at config load, so nginx refuses
# to start whenever a backend container is down. Variables defer resolution to
# request time via a resolver (127.0.0.11 = Docker's embedded DNS).
server {
  listen 80;
  server_name _;

  # Optional access control: the dashboard entrypoint writes auth.conf from
  # DASHBOARD_BASIC_AUTH (user:password in .env) — either an auth_basic pair
  # or an empty file. Applies to everything this server serves.
  include /etc/nginx/auth.conf;

  # Optional forward-auth (oauth2-proxy overlay, docker-compose.auth.yml). The
  # dashboard entrypoint writes forward-auth.conf from FORWARD_AUTH: either the
  # auth_request block (OIDC identity via oauth2-proxy) or an EMPTY file. When
  # empty, nginx issues no auth subrequest and the /oauth2/ locations below are
  # never reached, so the plain stack (either compose file) starts and serves
  # exactly as before — no oauth2-proxy needed. Included at server scope so auth_request
  # guards everything this server serves; the /oauth2/ locations opt back out
  # with `auth_request off;`. When on, forward-auth is the identity source and
  # the entrypoint leaves auth.conf empty (the two gates never stack).
  include /etc/nginx/forward-auth.conf;

  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # App shell: revalidate on every load (no-cache still allows storing; the
  # ETag turns the check into a 304) so a deploy shows up on the next reload
  # instead of after a hard refresh — without it browsers heuristic-cache
  # these and a new index.html runs against a stale app.js/style.css, which
  # renders a broken page. Icons and the pinned mermaid vendor bundle keep
  # heuristic caching; "/" internally redirects to /index.html, so the first
  # block covers both.
  # Every location below that sets its own add_header also includes
  # refresh-cookie.conf. nginx inherits add_header only into levels that
  # declare none of their own, so a Cache-Control here silently drops the
  # server-scope `add_header Set-Cookie $auth_cookie` that forward auth needs
  # to hand a refreshed session cookie back to the browser. The file is written
  # by the dashboard entrypoint and is empty unless FORWARD_AUTH=true.
  location = /index.html { include /etc/nginx/refresh-cookie.conf; add_header Cache-Control "no-cache"; }
  location = /app.js     { include /etc/nginx/refresh-cookie.conf; add_header Cache-Control "no-cache"; }
  location = /app.lib.js { include /etc/nginx/refresh-cookie.conf; add_header Cache-Control "no-cache"; }
  location = /style.css  { include /etc/nginx/refresh-cookie.conf; add_header Cache-Control "no-cache"; }

  # Instance config — render it from env at container start, or mount it.
  location = /config.json {
    alias /run/po11y/config.json;
    include /etc/nginx/refresh-cookie.conf;
    add_header Cache-Control "no-store";
  }

  # Feed routing. The dashboard entrypoint renders this file from
  # deploy/nginx/feeds-server.conf, proxying to the po11y server. Always
  # written before `exec nginx`, so nginx never references a missing file —
  # and always a variable upstream, so a stopped server is a 502 on one path
  # rather than a dashboard that refuses to start (see the note at the top of
  # this file).
  include /etc/nginx/feeds.conf;

  # Shared row/paging module, imported by /site/list.html AND by the MCP
  # server. lib/ is mounted read-only but NOT served as a directory: each
  # browser-reachable module gets its own exact-match location, like the feeds
  # above, so nothing new becomes web-reachable just by landing in lib/.
  # nginx's stock mime.types has no .mjs entry, hence default_type. (types{}
  # would REPLACE the inherited MIME table in this context, not extend it.)
  location = /lib/list-rows.mjs {
    alias /usr/share/nginx/lib/list-rows.mjs;
    default_type text/javascript;
    include /etc/nginx/refresh-cookie.conf;
    add_header Cache-Control "no-cache";
  }

  # Instance pages: every entry in config "tabs" is an iframe onto /site/...
  # Same revalidation as the shell — these pages change with deploys too.
  location /site/ {
    alias /usr/share/nginx/site/;
    include /etc/nginx/refresh-cookie.conf;
    add_header Cache-Control "no-cache";
  }

  # Form-trigger submit proxy — POST only, same origin, so the dashboard can
  # fire field-less forms via fetch() without CORS and without :5678 being
  # reachable from the client. GET (the rendered form page) is intentionally
  # NOT proxied: forms with fields still open n8n's own page, which knows how
  # to serve its assets.
  #
  # The location block itself is NOT inline here — the dashboard service
  # entrypoint (docker-compose*.yml) writes /etc/nginx/form-proxy.conf at
  # container start: the `location /form/ {...}` block when ENABLE_FORM_PROXY is
  # true, or an EMPTY file when false. Default: true on the bundled stack (the
  # Actions tab's whole point), false on the read-only stack
  # (docker-compose.readonly.yml). Security rationale for that default: with
  # DASHBOARD_BASIC_AUTH the dashboard's
  # single shared password would otherwise let anyone who can load the dashboard
  # fire n8n form-triggers, bypassing n8n's own auth — an unauthenticated (to
  # n8n) action surface on a shared team box.
  #
  # Per-group authorization (FORM_ALLOWED_GROUPS): under the forward-auth overlay
  # the entrypoint gates form firing on the verified $auth_groups (from
  # oauth2-proxy, via auth_request_set — see the provenance note below), denying
  # by default when the allowlist is empty. It renders the allowlist as an
  # http-scope `map $auth_groups $form_allowed` in /etc/nginx/conf.d/form-authz.conf
  # (auto-included by the main nginx.conf http block; `map` is invalid in this
  # server-scope include) and an `if ($form_allowed = 0) { return 403; }` in the
  # /form/ location. The rendered /form/ block also scrubs client X-Auth-Request-*
  # / X-Forwarded-* before proxying, same as /grafana/ and /n8n-table/ below.
  #
  # The upstream is injected too (FORM_PROXY_UPSTREAM, whitelisted to
  # scheme://host[:port]) so the read-only stack can target a remote n8n
  # rather than the compose-local n8n:5678 DNS name. The entrypoint always
  # writes the file (empty or not) before `exec nginx`, so this include never
  # references a missing file.
  include /etc/nginx/form-proxy.conf;

  # --- Forward-auth (oauth2-proxy) endpoints ---------------------------------
  # Always present, but only exercised when the forward-auth overlay is active:
  # forward-auth.conf (above) adds the `auth_request /oauth2/auth` that drives
  # them, and `error_page 401 = /oauth2/sign_in` sends unauthenticated users to
  # the sign-in redirect. The upstream is a runtime variable resolved via the
  # resolver at REQUEST time, so nginx starts fine in a plain stack (either
  # compose file) where no oauth2-proxy container exists — /oauth2/ is simply
  # never hit. Both
  # locations are EXEMPT from the server-level auth_request (the /oauth2/auth
  # subrequest must not recurse; a not-yet-authenticated user must be able to
  # reach sign_in) and from Basic Auth.
  #
  # SECURITY — identity provenance (the binding rule): identity is lifted ONLY
  # from this subrequest's RESPONSE headers, via `auth_request_set $auth_email
  # $upstream_http_x_auth_request_email` (and _groups) in forward-auth.conf.
  # nginx NEVER reads client REQUEST headers for identity — no
  # $http_x_forwarded_email / $http_x_forwarded_groups anywhere. A client may
  # POST its own X-Auth-Request-* / X-Forwarded-* to the front door, but those
  # are ignored for auth AND scrubbed before any proxied upstream (see the
  # explicit clears on /grafana/ and /n8n-table/ below) so nothing downstream
  # can mistake a forged header for a verified login.
  location = /oauth2/auth {
    auth_request off;
    auth_basic off;
    set $oauth2_upstream http://oauth2-proxy:4180;
    proxy_pass $oauth2_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    # auth_request forwards headers but not the request body.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }
  location /oauth2/ {
    auth_request off;
    auth_basic off;
    set $oauth2_upstream http://oauth2-proxy:4180;
    proxy_pass $oauth2_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
  }

  # Grafana in subpath mode (GF_SERVER_SERVE_FROM_SUB_PATH=true). The variable
  # upstream + resolver mean nginx starts fine even while grafana is down —
  # safe to keep active in vendored setups without a grafana service too.
  location /grafana/ {
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_set_header Host $http_host;
    # With DASHBOARD_BASIC_AUTH on, the browser sends its Basic credentials on
    # every request; Grafana would try them against its own users and 401.
    # Grafana logins use session cookies, so dropping the header is safe.
    proxy_set_header Authorization "";
    # Direct-to-nginx header-forgery defence: a client could send its own
    # X-Auth-Request-* / X-Forwarded-{Email,Groups,User} to the front door,
    # hoping a header-auth-aware upstream reads them as a verified identity. Our
    # auth never reads client request headers (identity comes only from the
    # oauth2-proxy subrequest response, see the /oauth2/ note above), so these
    # are already ignored for access control — but scrub them here so a forged
    # value can never reach Grafana.
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-Groups "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # MCP server (read-only). No auth directives here on purpose: auth.conf and
  # forward-auth.conf are included at server level above, so this location is
  # already behind whichever gate is active. The MCP surface is a route on the
  # po11y server, which has no auth of its own and is not published to the
  # host, so nginx is the only way in — MCP access is dashboard access, see
  # docs/security.md.
  location /mcp/ {
    set $mcp_upstream http://server:8081;
    proxy_pass $mcp_upstream/mcp;
    proxy_set_header Host $http_host;
    # The dashboard's Basic credentials are for nginx, not for the MCP server;
    # drop the header so nothing downstream can mistake it for its own auth.
    proxy_set_header Authorization "";
    # Same header-forgery scrub as /grafana/: our auth never reads client
    # request headers, but a forged identity header must not reach an upstream.
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-Groups "";
    proxy_http_version 1.1;
    # MCP responses can stream; do not let nginx sit on them.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Prometheus: exactly the two read-only query endpoints, GET only — the
  # browser gets keyless metric reads and nothing else.
  location = /prom/api/v1/query {
    limit_except GET { deny all; }
    set $prometheus_upstream http://prometheus:9090;
    rewrite ^/prom(/.*)$ $1 break;
    proxy_pass $prometheus_upstream;
  }
  location = /prom/api/v1/query_range {
    limit_except GET { deny all; }
    set $prometheus_upstream http://prometheus:9090;
    rewrite ^/prom(/.*)$ $1 break;
    proxy_pass $prometheus_upstream;
  }

  # n8n DataTable read proxy — nginx only forwards. The po11y server owns the
  # enforcement: GET-only, data-tables-only allowlist, 403 for everything else,
  # and the N8N_READ_API_KEY injection (server/http.mjs). CI asserts
  # /n8n-table/workflows returns exactly 403, which originates in the server.
  location /n8n-table/ {
    set $server_upstream http://server:8081;
    proxy_pass $server_upstream;
    proxy_set_header Host $http_host;
    # The dashboard's Basic credentials are for nginx; and the same
    # header-forgery scrub as /grafana/ and /mcp/ (see those notes).
    proxy_set_header Authorization "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-Groups "";
  }
}
