# Po11y example nginx config — copy into your stack and adjust the aliases.
# Serves the static app, the instance config, the live status feeds, and any
# instance pages (iframe tabs) under /site/.
#
# Upstreams (if you enable the grafana/prometheus blocks) should be variables:
# a literal proxy_pass hostname is resolved at config load, so nginx refuses
# to start whenever a backend container is down. Variables defer resolution to
# request time via a resolver (127.0.0.11 = Docker's embedded DNS).
server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Instance config — render it from env at container start, or mount it.
  location = /config.json {
    alias /run/po11y/config.json;
    add_header Cache-Control "no-store";
  }

  # Live state + notification feed, written by your publisher (atomically:
  # write to a tmp file on the same volume, then rename).
  location = /status.json {
    alias /po11y-status/status.json;
    add_header Cache-Control "no-store";
  }
  location = /notifications.json {
    alias /po11y-status/notifications.json;
    add_header Cache-Control "no-store";
  }

  # Workflow map, written by the maps core workflow.
  location = /map.json {
    alias /po11y-status/map.json;
    add_header Cache-Control "no-store";
  }

  # AI-authored architecture map, written by the maps core workflow.
  location = /ai-map.json {
    alias /po11y-status/ai-map.json;
    add_header Cache-Control "no-store";
  }

  # Live form-trigger inventory, written by the maps core workflow; the
  # dashboard merges it into the Actions cards.
  location = /forms.json {
    alias /po11y-status/forms.json;
    add_header Cache-Control "no-store";
  }

  # Instance pages: every entry in config "tabs" is an iframe onto /site/...
  location /site/ {
    alias /usr/share/nginx/site/;
  }

  # Grafana in subpath mode (GF_SERVER_SERVE_FROM_SUB_PATH=true). The variable
  # upstream + resolver mean nginx starts fine even while grafana is down —
  # safe to keep active in vendored setups without a grafana service too.
  location /grafana/ {
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Prometheus: exactly the two read-only query endpoints, GET only — the
  # browser gets keyless metric reads and nothing else.
  location = /prom/api/v1/query {
    limit_except GET { deny all; }
    set $prometheus_upstream http://prometheus:9090;
    rewrite ^/prom(/.*)$ $1 break;
    proxy_pass $prometheus_upstream;
  }
  location = /prom/api/v1/query_range {
    limit_except GET { deny all; }
    set $prometheus_upstream http://prometheus:9090;
    rewrite ^/prom(/.*)$ $1 break;
    proxy_pass $prometheus_upstream;
  }
}
