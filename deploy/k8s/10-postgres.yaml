# Postgres — n8n datastore and grafana datasource. Compose: postgres:16-alpine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: po11y
  labels:
    app: postgres
spec:
  replicas: 1
  # Recreate: the RWO postgres-data PVC must never be attached to two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "n8n"          # DB_POSTGRESDB_DATABASE default
            - name: POSTGRES_USER
              value: "n8n"          # DB_POSTGRESDB_USER default
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: po11y-secrets
                  key: DB_POSTGRESDB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "n8n", "-d", "n8n"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: po11y
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
