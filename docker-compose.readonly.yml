# Po11y read-only stack — against an EXISTING n8n.
#
# Unlike the bundled stack (docker-compose.yml) this brings up NO n8n and NO
# postgres, and there is NO bootstrap.sh: the
# server polls a remote n8n's public API read-only and publishes the
# dashboard feeds (map/forms/ai-map/status) that the dashboard serves. There
# is no owner account to create and no secrets to generate on disk —
# everything comes from a handful of env vars:
#
#   N8N_API_URL          https URL of the remote n8n  (required)
#   N8N_API_KEY          a public-API key on that n8n (required; GET-only use)
#   N8N_METRICS_TARGET   host:port of the remote n8n /metrics (required; the
#                        remote must run with N8N_METRICS=true — absent metrics
#                        degrade gracefully to an empty Grafana tab)
#   SERVER_POLL_INTERVAL seconds between polls (default 30 — lower it further to
#                        catch workflows that finish inside one interval)
#   EXECUTIONS_LIMIT     recent-executions window per poll (default 250, which
#                        is n8n's API cap; see "Sizing the executions window"
#                        in docs/configuration.md)
#   BIND_ADDR / DASHBOARD_PORT / DASHBOARD_BASIC_AUTH / GRAFANA_ADMIN_PASSWORD
#                        reused verbatim from the bundled stack (see .env.example)
#   ENABLE_FORM_PROXY / FORM_PROXY_UPSTREAM   see the dashboard service + nginx
#
# Bring-up (no bootstrap):
#   docker compose -f docker-compose.readonly.yml up -d
#
# See the "Read-only stack" section of .env.example for the full variable list.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: po11y-prometheus
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    environment:
      - N8N_METRICS_TARGET=${N8N_METRICS_TARGET:?set N8N_METRICS_TARGET=host:port of the remote n8n /metrics}
    # prom/prometheus is a busybox image: it ships /bin/sh + sed but NOT gettext's
    # envsubst, so — mirroring the grafana service's sed entrypoint rather than the
    # dashboard's envsubst one — we sed the remote target into a rendered copy of
    # the config on the writable tsdb volume, then exec prometheus against it. The
    # retention flag is interpolated by compose (same as the bundled stack's `command`).
    entrypoint:
      - /bin/sh
      - -euc
      - |
        sed "s|__N8N_METRICS_TARGET__|$$N8N_METRICS_TARGET|g" \
          /etc/prometheus/prometheus.readonly.yml > /prometheus/prometheus.rendered.yml
        exec /bin/prometheus \
          --config.file=/prometheus/prometheus.rendered.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-180d}
    volumes:
      - ./observability/prometheus.readonly.yml:/etc/prometheus/prometheus.readonly.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: po11y-grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # There is no postgres here: the n8n-postgres datasource provisioned
      # from observability/grafana/provisioning is inert (and any dashboard
      # panel backed by it stays empty) — the prometheus datasource is what
      # feeds these tabs instead. These are passed only so provisioning
      # interpolation has values; they wire up to nothing.
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - PO11Y_RO_USER=po11y_ro
      - PO11Y_RO_PASSWORD=${PO11Y_RO_PASSWORD:-}
      # Grafana interpolates ${VAR} in provisioning YAML but NOT in dashboard
      # JSON — the entrypoint seds the n8n deep-link host into a rendered copy.
      # BIND_ADDR stays what it says: the address this stack publishes on.
      - BIND_ADDR=${BIND_ADDR:-127.0.0.1}
      # The host a reader's browser reaches the REMOTE n8n at, for the deep
      # links in the dashboards. On this topology that is never BIND_ADDR: n8n
      # is on another machine, and binding to its address would fail. Defaults
      # to BIND_ADDR (correct on the bundled stack); set it here to the remote
      # host — the panels and metrics work either way.
      - N8N_LINK_HOST=${N8N_LINK_HOST:-}
      - GF_PATHS_PROVISIONING=/tmp/grafana-provisioning
      - GF_SERVER_ROOT_URL=http://${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8080}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=${DASHBOARD_GRAFANA_EMBED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=${DASHBOARD_GRAFANA_EMBED:-true}
    # The same script the bundled stack uses. This file mounts no alerting-src,
    # so the script's alerting branch is skipped: four of the five Grafana
    # rules query a postgres that does not exist here. Alerting here is the
    # server's watchdog and the optional docker-compose.alerts.yml overlay.
    entrypoint: ["sh", "/etc/po11y-grafana-entrypoint.sh"]
    volumes:
      - ./observability/grafana/entrypoint.sh:/etc/po11y-grafana-entrypoint.sh:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning-src:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Same nginx image and config as the bundled stack. Feeds are proxied to the
  # server service (below) — see nginx.conf's feed-routing include.
  dashboard:
    image: nginx:1.27-alpine
    container_name: po11y-dashboard
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"
    environment:
      # Optional "user:password" gate for the whole dashboard (see .env.example).
      - DASHBOARD_BASIC_AUTH=${DASHBOARD_BASIC_AUTH:-}
      # Form-trigger submit proxy. OFF by default here: on a shared team box
      # the dashboard's single Basic-Auth password would otherwise let anyone
      # fire n8n form-triggers, bypassing n8n's own auth (see nginx.conf's /form/
      # note). If you deliberately enable it, point FORM_PROXY_UPSTREAM at the
      # remote n8n — there is no `n8n` DNS name on this stack.
      - ENABLE_FORM_PROXY=${ENABLE_FORM_PROXY:-false}
      - FORM_PROXY_UPSTREAM=${FORM_PROXY_UPSTREAM:-http://n8n:5678}
      # Comma-separated OIDC group names allowed to fire forms. ENFORCED ONLY
      # under FORWARD_AUTH (verified $auth_groups); with forward-auth on and this
      # empty, form firing is DENIED by default. Ignored (with a startup notice)
      # when FORWARD_AUTH is off. See nginx.conf's /form/ note + docs/forward-auth.md.
      - FORM_ALLOWED_GROUPS=${FORM_ALLOWED_GROUPS:-}
      # Forward-auth (oauth2-proxy overlay) switch. Off unless the
      # docker-compose.auth.yml overlay flips it on; when on, the entrypoint
      # renders the nginx auth_request include and disables Basic Auth.
      - FORWARD_AUTH=${FORWARD_AUTH:-false}
      # Upstream for the feeds proxied to the po11y server (below). See
      # nginx.conf's feed-routing include and deploy/nginx/feeds-server.conf.
      - FEED_UPSTREAM=${FEED_UPSTREAM:-http://server:8081}
    # Shared by every compose file that runs the dashboard. Do NOT inline this
    # again: compose replaces an entrypoint rather than merging it (the same
    # A3 bug class the grafana entrypoint had) — ci/check-dashboard-entrypoint.sh
    # enforces the canonical form.
    entrypoint: ["sh", "/etc/po11y-dashboard-entrypoint.sh"]
    volumes:
      - ./deploy/nginx/dashboard-entrypoint.sh:/etc/po11y-dashboard-entrypoint.sh:ro
      - ./html:/usr/share/nginx/html:ro
      - ./site:/usr/share/nginx/site:ro
      # Read-only; only the one file exposed by nginx's exact-match location is
      # reachable. See nginx.conf's /lib/list-rows.mjs block.
      - ./lib:/usr/share/nginx/lib:ro
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./config.json:/run/po11y/config.json:ro
      - ./deploy/nginx:/etc/nginx/po11y-feeds:ro
    depends_on:
      - grafana

  # The po11y server (see docker-compose.yml's comment). This stack reuses
  # the same GET-only N8N_API_KEY. No GRAFANA_URL here: this stack provisions
  # no postgres datasource, so po11y_sql is off by construction.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: po11y-server
    restart: unless-stopped
    read_only: true
    environment:
      N8N_API_URL: ${N8N_API_URL:?set N8N_API_URL to the remote n8n base URL}
      # Usually redundant here — the remote n8n's URL is already the one a
      # reader opens, and an unset value falls back to it. Set it only when
      # po11y reaches n8n by an address a reader cannot: a tunnel, a private
      # DNS name, a mesh IP.
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:?set N8N_API_KEY to a public-API key on that n8n}
      SYNC_INTERVAL: ${SERVER_SYNC_INTERVAL:-600}
      SYNC_RETRY_INTERVAL: ${SERVER_SYNC_RETRY_INTERVAL:-15}
      POLL_INTERVAL: ${SERVER_POLL_INTERVAL:-30}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-30000}
      EXECUTIONS_LIMIT: ${EXECUTIONS_LIMIT:-250}
      PO11Y_RETENTION_DAYS: ${PO11Y_RETENTION_DAYS:-30}
      PO11Y_PACK: ${PO11Y_PACK:-}
      PO11Y_SCOPE: ${PO11Y_SCOPE:-default}
      PO11Y_INGEST_TOKEN: ${PO11Y_INGEST_TOKEN:-}
      PO11Y_DATATABLES: ${PO11Y_DATATABLES:-}
      PO11Y_MAX_BODY_BYTES: ${PO11Y_MAX_BODY_BYTES:-1000000}
      AI_MAP_BASE_URL: ${AI_MAP_BASE_URL:-}
      AI_MAP_API_KEY: ${AI_MAP_API_KEY:-}
      AI_MAP_MODEL: ${AI_MAP_MODEL:-}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ALERT_MIN_ERRORS: ${ALERT_MIN_ERRORS:-}
      ALERT_ERROR_RATE: ${ALERT_ERROR_RATE:-}
      ALERT_STALE_AFTER_MIN: ${ALERT_STALE_AFTER_MIN:-}
      ALERT_STUCK_AFTER_MIN: ${ALERT_STUCK_AFTER_MIN:-}
      ALERT_IGNORE: ${ALERT_IGNORE:-}
      ALERT_RENOTIFY_MIN: ${ALERT_RENOTIFY_MIN:-}
      ALERT_FEED_MAX: ${ALERT_FEED_MAX:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-slack}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_TIMEOUT_MS: ${ALERT_WEBHOOK_TIMEOUT_MS:-10000}
      ALERT_HEARTBEAT_URL: ${ALERT_HEARTBEAT_URL:-}
      ALERT_HEARTBEAT_TIMEOUT_MS: ${ALERT_HEARTBEAT_TIMEOUT_MS:-10000}
      PROMETHEUS_URL: http://prometheus:9090
      N8N_READ_API_KEY: ${N8N_READ_API_KEY:-}
      CONFIG_PATH: /app/config.json
    volumes:
      - po11y_store:/data
      - ./config.json:/app/config.json:ro

volumes:
  prometheus_data:
  grafana_data:
  po11y_store:
