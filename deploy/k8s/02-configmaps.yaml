# ConfigMaps holding the small text config files that compose bind-mounts.
#
# Large static asset directories are NOT inlined here (a ConfigMap is capped at
# ~1 MiB and cannot represent nested directories). Create those imperatively —
# see deploy/k8s/README.md. In particular:
#
#   # Dashboard static site (html/ incl. the 2.5 MB html/vendor/mermaid.min.js):
#   kubectl -n po11y create configmap po11y-html   --from-file=html/
#   kubectl -n po11y create configmap po11y-vendor  --from-file=html/vendor/
#   kubectl -n po11y create configmap po11y-site    --from-file=site/
#
#   # Grafana dashboard JSON (34 KB + 57 KB — too large / churny to inline):
#   kubectl -n po11y create configmap grafana-dashboards-json \
#     --from-file=observability/grafana/provisioning/dashboards/json/
#
#   # Grafana entrypoint + the bundled stack's alert rules — created from the
#   # canonical repo files rather than inlined here, so the k8s copy cannot
#   # drift from what compose runs (the same reason the entrypoint is one
#   # shared script at all):
#   kubectl -n po11y create configmap grafana-entrypoint \
#     --from-file=observability/grafana/entrypoint.sh
#   kubectl -n po11y create configmap grafana-alerting \
#     --from-file=observability/grafana/alerting/
#
#   # Module behind the dashboard's list tabs (nginx serves it at
#   # /lib/list-rows.mjs; optional — only a config with a list tab needs it):
#   kubectl -n po11y create configmap po11y-lib --from-file=lib/list-rows.mjs
#
# The grafana entrypoint sed-loops over dashboards/json/*.json, so the
# grafana-dashboards-json ConfigMap MUST exist before grafana starts or the
# container crash-loops on an unmatched glob.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: po11y-nginx
  namespace: po11y
data:
  # A REDUCED copy of ./nginx.conf — not a verbatim one. Upstreams
  # (grafana:3000, prometheus:9090) resolve to the ClusterIP Services of the
  # same name in this namespace. The resolver line is Docker's embedded DNS
  # (127.0.0.11); on k8s it is harmless — nginx also passes literal Service
  # names to kube-dns via the variable-upstream form, so backends being down
  # never blocks nginx start.
  #
  # Deliberately absent here, because the compose entrypoints render them at
  # container start and nothing renders them on k8s:
  #
  #   - the auth include. THERE IS NO AUTHENTICATION ON K8S. Neither Basic Auth
  #     nor forward-auth OIDC exists in this config, so anything that can reach
  #     the Service can read every feed and every embedded Grafana panel. Put
  #     an authenticating Ingress in front of it — see the warning in README.md.
  #   - /mcp/ (no mcp Deployment here either)
  #   - the /form/ submit proxy
  #   - the /status/<scope>/ regexes (no multi-team scopes)
  #   - /n8n-table/ (the DataTable read proxy)
  #   - the identity-header scrubs the forward-auth path relies on
  #
  # Status feeds: the compose path proxies every feed to the po11y `server`
  # process (deploy/nginx/feeds-server.conf). There is no server Deployment on
  # this k8s path, and the block that used to alias a shared status volume
  # directly is gone too — see deploy/k8s/README.md's "Status feeds do not
  # work" section for what that means and what porting it over would take.
  #
  # Keep this list current when you edit ./nginx.conf.
  default.conf: |
    server {
      listen 80;
      server_name _;

      resolver 127.0.0.11 valid=10s ipv6=off;

      root /usr/share/nginx/html;
      index index.html;

      location = /config.json {
        alias /run/po11y/config.json;
        add_header Cache-Control "no-store";
      }

      # status.json, notifications.json, map.json, ai-map.json and forms.json
      # are NOT served here. They used to alias a shared volume that n8n
      # workflows wrote; those workflows are gone, and there is no server
      # Deployment on this k8s path to proxy them to instead. Every feed
      # request 404s until that gap is closed — see deploy/k8s/README.md.

      location /site/ {
        alias /usr/share/nginx/site/;
      }

      # Module behind the dashboard's list tabs (mirrors ./nginx.conf, incl.
      # its exact-match + default_type rationale). 404s harmlessly unless the
      # optional po11y-lib ConfigMap is mounted — and a config with no list
      # tab never requests it.
      location = /lib/list-rows.mjs {
        alias /usr/share/nginx/lib/list-rows.mjs;
        default_type text/javascript;
        add_header Cache-Control "no-cache";
      }

      location /grafana/ {
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }

      location = /prom/api/v1/query {
        limit_except GET { deny all; }
        set $prometheus_upstream http://prometheus:9090;
        rewrite ^/prom(/.*)$ $1 break;
        proxy_pass $prometheus_upstream;
      }
      location = /prom/api/v1/query_range {
        limit_except GET { deny all; }
        set $prometheus_upstream http://prometheus:9090;
        rewrite ^/prom(/.*)$ $1 break;
        proxy_pass $prometheus_upstream;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: po11y-config
  namespace: po11y
data:
  # From config.example.json. Mounted at /run/po11y/config.json and served by
  # nginx at /config.json. {host} is resolved client-side by the dashboard JS.
  config.json: |
    {
      "title": "Po11y",
      "eyebrow": "po11y · status",
      "lede": "Live view of this stack. Status feeds do not work on this k8s path yet — see deploy/k8s/README.md — but the Map tab is generated from the n8n instance itself.",
      "footer": [
        { "text": "po11y", "href": "https://github.com/labrise-consulting/po11y" }
      ],
      "cards": {
        "Actions": [
          { "name": "New workflow", "sub": "open the n8n editor", "href": "http://{host}:5678/workflow/new" }
        ],
        "Monitoring": [
          { "name": "n8n", "sub": "workflow editor", "href": "http://{host}:5678/" },
          { "name": "Execution analytics", "sub": "grafana", "href": "/grafana/d/adfcxfk" },
          { "name": "System health", "sub": "n8n process metrics", "href": "/grafana/d/adv6qmb" },
          { "name": "Prometheus", "sub": "raw metrics", "href": "http://{host}:9090/" }
        ]
      },
      "tabs": [
        { "id": "map", "label": "Map", "src": "/site/map.html" },
        { "id": "arch", "label": "Architecture", "src": "/site/ai-map.html" }
      ],
      "sections": {
        "executions": "Workflow executions",
        "notifications": "Notifications"
      },
      "metrics": {
        "heading": "Metrics",
        "grafana": {
          "embed": true,
          "base": "/grafana",
          "dashboard": "adfcxfk",
          "panels": [ { "id": 19 }, { "id": 26, "wide": true } ],
          "range": "now-7d"
        },
        "promBase": "/prom",
        "stats": [
          { "label": "n8n", "up": "up{job=\"n8n\"}", "mem": "process_resident_memory_bytes{job=\"n8n\"}" }
        ]
      },
      "refreshSec": 30,
      "staleAfterMin": 5,
      "statusHint": "status.json missing — expected: this k8s path does not serve feeds yet, see deploy/k8s/README.md"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: po11y-prometheus
  namespace: po11y
data:
  # Verbatim ./observability/prometheus.yml. Target n8n:5678 is the n8n Service.
  prometheus.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      - job_name: n8n
        metrics_path: /metrics
        static_configs:
          - targets: ["n8n:5678"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: po11y
data:
  # ./observability/grafana/provisioning/datasources/datasources.yml
  # Grafana interpolates ${VAR} in provisioning YAML from the pod env, so the
  # DB_POSTGRESDB_* env vars on the grafana Deployment fill these in.
  # KNOWN DIVERGENCE from compose: compose authenticates this datasource as
  # the read-only po11y_ro role (created by bootstrap.sh); these manifests
  # have no bootstrap equivalent, so Grafana here still uses n8n's own DB
  # credentials with full privileges.
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: n8n-postgres
        uid: n8n-postgres
        type: postgres
        access: proxy
        url: postgres:5432
        database: ${DB_POSTGRESDB_DATABASE}
        user: ${DB_POSTGRESDB_USER}
        secureJsonData:
          password: ${DB_POSTGRESDB_PASSWORD}
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          maxOpenConns: 5
        isDefault: false

      - name: n8n-prometheus
        uid: n8n-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  # ./observability/grafana/provisioning/dashboards/dashboards.yml
  # The grafana entrypoint rewrites the /etc/grafana/provisioning/ path prefix
  # to /tmp/grafana-provisioning/ at start, so this path is correct as-is.
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: n8n
        orgId: 1
        folder: n8n
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/json
