# Secrets for the po11y stack.
#
# The values below are PLACEHOLDERS. Do NOT commit real credentials. Either:
#   1. Replace the stringData values here in a private copy, or
#   2. Delete these manifests and create the Secrets imperatively, e.g.:
#
#      kubectl -n po11y create secret generic po11y-secrets \
#        --from-literal=DB_POSTGRESDB_PASSWORD="$(openssl rand -base64 24)" \
#        --from-literal=PO11Y_RO_PASSWORD="$(openssl rand -base64 24)" \
#        --from-literal=GRAFANA_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#        --from-literal=N8N_OWNER_PASSWORD='Chang3Me!'
#
#      kubectl -n po11y create secret generic po11y-ai-map \
#        --from-file=ai-map.json=./secrets/ai-map.json
#
# Password policy for N8N_OWNER_PASSWORD: >=8 chars, >=1 number, >=1 capital.
---
apiVersion: v1
kind: Secret
metadata:
  name: po11y-secrets
  namespace: po11y
type: Opaque
stringData:
  # Shared Postgres password: consumed by postgres and n8n. Grafana no longer
  # holds it — see PO11Y_RO_PASSWORD below.
  DB_POSTGRESDB_PASSWORD: "CHANGE_ME_db_password"
  # Password for po11y_ro, the SELECT-only role Grafana's n8n-postgres
  # datasource authenticates as. Grafana exposes that datasource to an
  # anonymous Viewer, and a Viewer may run arbitrary SQL through
  # /api/ds/query, so whatever the datasource can read is readable by anyone
  # who can reach Grafana. The role is created by the init container on the
  # grafana Deployment, mirroring what bootstrap.sh does on the compose stack.
  # Must differ from DB_POSTGRESDB_PASSWORD: reusing it hands the same Viewer
  # n8n's own credentials back.
  PO11Y_RO_PASSWORD: "CHANGE_ME_readonly_password"
  # Grafana admin (GF_SECURITY_ADMIN_PASSWORD).
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_grafana_password"
  # n8n owner account (used by bootstrap in the compose stack; kept here so the
  # value has a home in k8s even though headless owner creation is out of scope).
  N8N_OWNER_PASSWORD: "CHANGE_ME_Owner1"
---
# AI-map config, mounted read-only at /run/po11y/ai-map.json in the n8n pod.
# Mirrors ./secrets/ai-map.json from the compose stack. An empty JSON object
# ({}) selects the free heuristic map (no LLM). To enable LLM prose, fill in an
# OpenAI-compatible endpoint (base_url), api_key and model.
apiVersion: v1
kind: Secret
metadata:
  name: po11y-ai-map
  namespace: po11y
type: Opaque
stringData:
  ai-map.json: |
    {"base_url": "", "api_key": "", "model": ""}
